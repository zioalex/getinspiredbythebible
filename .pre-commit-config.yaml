# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^frontend/
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^frontend/
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
        exclude: ^frontend/
      - id: check-added-large-files
        stages: [pre-commit]
        args: ["--maxkb=1000"]
        # luther1912.json and hindi.json are committed Bibles (~4-9.5 MB) with
        # no downloadable source; exempt them from the 1 MB cap. See BITB-046
        # and data/bible/LICENSES.md.
        exclude: ^data/bible/translations/(luther1912|hindi)\.json$
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
        args: ["--fix=lf"]
      - id: detect-private-key
        stages: [pre-commit]

  # Python - Black (code formatting)
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        stages: [pre-commit]
        files: ^api/
        args: ["--line-length=100"]

  # Python - Ruff (linting - replaces flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        stages: [pre-commit]
        files: ^api/
        args: ["--select", "E,F,W,C90,I,N", "--ignore", "E501", "--fix", "--exit-non-zero-on-fix"]

  # Python - MyPy (type checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        stages: [pre-push]
        files: ^api/
        # api/alembic/ (Alembic's own scaffold, no __init__.py) is excluded from this
        # pinned mypy 1.8.0 hook only: mypy resolves it as a namespace package literally
        # named "alembic" when multiple api/ files are checked together, which shadows
        # the installed `alembic` PyPI package for `from alembic import op/context` and
        # produces a false "Module has no attribute" error (a known mypy limitation for a
        # local dir colliding with an installed distribution name -- see
        # https://github.com/python/mypy/issues/10328). CI's unpinned/newer mypy
        # (.github/workflows/test_update.yml) does not hit this and type-checks
        # api/alembic/ normally; `make type-check` / `mypy .` locally with a current
        # mypy also passes it cleanly (verified for BITB-004).
        exclude: ^api/alembic/
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests
          - types-PyYAML

  # Python - Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        stages: [pre-push]
        files: ^api/
        args: ["-ll", "-i", "--skip", "B101,B601,B608"]

  # Docker - Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        stages: [pre-push]
        args: ["--ignore", "DL3008", "--ignore", "DL3018"]
        exclude: .

  # YAML formatting (runs before yamllint to auto-fix line length issues)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        stages: [pre-push]
        name: prettier-yaml
        types: [yaml]
        args: ["--prose-wrap", "always", "--print-width", "120"]
        # prod-monitor.yml has a BACKEND_URL value that exceeds 120 chars with no
        # clean wrapping point; different prettier versions disagree on formatting.
        exclude: ^(frontend/|\.github/workflows/prod-monitor\.yml)

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        stages: [pre-push]
        args:
          - --strict
          - -d
          - "{extends: default, rules: {line-length: {max: 120}, document-start: disable, comments:
            {min-spaces-from-content: 1}}}"

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        stages: [pre-push]
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        stages: [pre-push]
        files: \.(sh|bash)$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        stages: [pre-push]
        args: ["--fix"]

  # Frontend - Prettier (formatting)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        stages: [pre-push]
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: 'package-lock.json|\.next/'

  # Frontend - ESLint (uses project-local eslint with flat config)
  # Note: NVM must be sourced so the correct Node.js version is used,
  # because VS Code git hooks don't inherit the NVM shell environment.
  - repo: local
    hooks:
      - id: eslint
        stages: [pre-push]
        name: eslint
        entry:
          bash -c 'export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; cd frontend && npx
          eslint --fix "${@/#frontend\//}"' --
        language: system
        files: ^frontend/src/.*\.[jt]sx?$
        types: [file]

# Default language version
default_language_version:
  python: python3
  node: 22.22.0
