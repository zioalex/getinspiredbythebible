# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/
      - id: end-of-file-fixer
        exclude: ^frontend/
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # Python - Black (code formatting)
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        files: ^api/
        args: ["--line-length=100"]

  # Python - Ruff (linting - replaces flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        files: ^api/
        args:
          [
            "--select",
            "E,F,W,C90,I,N",
            "--ignore",
            "E501",
            "--fix",
            "--exit-non-zero-on-fix",
          ]

  # Python - MyPy (type checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^api/
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests
          - types-PyYAML

  # Python - Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        files: ^api/
        args: ["-ll", "-i", "--skip", "B101,B601,B608"]

  # Docker - Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ["--ignore", "DL3008", "--ignore", "DL3018"]

  # YAML formatting (runs before yamllint to auto-fix line length issues)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier-yaml
        types: [yaml]
        args: ["--prose-wrap", "always", "--print-width", "120"]
        exclude: ^frontend/

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args:
          - --strict
          - -d
          - "{extends: default, rules: {line-length: {max: 120}, document-start: disable, comments:
            {min-spaces-from-content: 1}}}"

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ["--fix"]

  # Frontend - Prettier (formatting)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: 'package-lock.json|\.next/'

  # Frontend - ESLint (uses project-local eslint with flat config)
  # Note: NVM must be sourced so the correct Node.js version is used,
  # because VS Code git hooks don't inherit the NVM shell environment.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry:
          bash -c 'export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; cd frontend && npx
          eslint --fix "${@/#frontend\//}"' --
        language: system
        files: ^frontend/src/.*\.[jt]sx?$
        types: [file]

# Default language version
default_language_version:
  python: python3
  node: 22.22.0
