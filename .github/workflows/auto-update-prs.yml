name: Auto-update PR branches

# BITB-165. `main` requires PR branches to be up to date and merge queues are unavailable on a
# personal-account repo, so this workflow updates the branch of every opted-in open PR that is
# behind `main` whenever `main` moves. With GitHub auto-merge, PRs then merge themselves once green.
#
# Opt-in: enable auto-merge on the PR, or add the `autoupdate` label. Drafts, forks, Dependabot
# and release-please PRs are skipped.
#
# A PAT does the update, not GITHUB_TOKEN: updates made with GITHUB_TOKEN do not trigger
# workflows, so CI would never run on the updated PR. Set repository secret AUTO_UPDATE_PR_TOKEN
# (fine-grained PAT: Contents RW + Pull requests RW); falls back to RELEASE_PLEASE_TOKEN.
"on":
  push:
    branches:
      - main
  pull_request:
    types: [auto_merge_enabled, labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be updated without updating"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'auto_merge_enabled' || github.event.label.name == 'autoupdate'))
    steps:
      # Always the default branch: never run PR-modified script code with the PAT.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update behind PR branches
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_PR_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--pr "$PR_NUMBER")
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/auto_update_prs.py "${args[@]}"
