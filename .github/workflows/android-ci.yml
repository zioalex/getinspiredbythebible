name: Android CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Android CI PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Android CI ({0})', github.ref_name) }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit Tests (pure JVM — no emulator needed, fast)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: android

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Debug APK build (validates the project compiles)
  # ---------------------------------------------------------------------------
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Secrets Detection
  # ---------------------------------------------------------------------------
  # Two complementary tools:
  #   1. TruffleHog  – scans the git diff between PR base and HEAD for verified
  #      secrets (API keys, tokens, creds) that are actually live/confirmed.
  #      Runs on PRs only (requires base SHA from pull_request event).
  #   2. detect-secrets – static heuristic scan of the android/ tree checked
  #      against the repo-wide .secrets.baseline; fails on any NEW finding not
  #      already acknowledged in the baseline. Runs on PRs and pushes to main.
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history required for TruffleHog diff scan

      - name: TruffleHog OSS scan (PR only)
        # TruffleHog diff scan requires a distinct base SHA — only available on
        # pull_request events. Skip on push-to-main (no diff base to compare).
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./android
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: detect-secrets baseline check
        run: | # pragma: allowlist secret
          pip install detect-secrets==1.4.0

          # Scan the android/ directory and update a temporary scan result.
          # --baseline causes detect-secrets to compare against the existing
          # .secrets.baseline and exit non-zero when NEW secrets are found.
          detect-secrets scan android/ \
            --baseline .secrets.baseline \
            --exclude-files 'android/gradle/wrapper/gradle-wrapper.jar' \
            --exclude-files '.*\.png$' \
            --exclude-files '.*\.jpg$'

          # `audit --report` prints any unreviewed findings and exits non-zero
          # if there are secrets that have not been acknowledged in the baseline.
          detect-secrets audit --report --baseline .secrets.baseline
