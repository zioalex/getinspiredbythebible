name: Android CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "tests/**"
      - ".github/workflows/android-ci.yml"
  push:
    # No paths filter on main: every commit landing on main must produce an
    # Android-CI verdict so release-please (workflow_run-gated) and the
    # publish-time CI-green check have a definitive status to read.
    branches: [main]
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Android CI PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Android CI ({0})', github.ref_name) }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Translation Validation — ensures all strings in values/strings.xml exist
  # in all locale files. Runs early to catch missing translations quickly.
  # ---------------------------------------------------------------------------
  translation-validation:
    name: Translation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate translations
        run: |
          # Get all string resource names from the default (English) strings.xml
          DEFAULT_FILE="android/app/src/main/res/values/strings.xml"
          DEFAULT_NAMES=$(grep -oP '(?<=<string name=")[^"]+' "$DEFAULT_FILE" | sort -u)

          # Locale directories: only consider values-XX/ dirs that actually contain
          # a strings.xml file (excludes qualifier-only dirs like values-night/,
          # values-v21/, values-land/, etc. which hold themes/styles, not strings).
          LOCALES=$(for dir in android/app/src/main/res/values-*/; do
            locale=$(echo "$dir" | sed 's|.*/values-||' | sed 's|/||')
            if [ -f "${dir}strings.xml" ]; then
              echo "$locale"
            fi
          done)

          MISSING=""
          for LOCALE in $LOCALES; do
            LOCALE_FILE="android/app/src/main/res/values-$LOCALE/strings.xml"
            LOCALE_NAMES=$(grep -oP '(?<=<string name=")[^"]+' "$LOCALE_FILE" | sort -u)
            for NAME in $DEFAULT_NAMES; do
              if ! echo "$LOCALE_NAMES" | grep -q "^$NAME$"; then
                MISSING="$MISSING\n  - $LOCALE: '$NAME' is missing"
              fi
            done
          done

          if [ -n "$MISSING" ]; then
            echo "=== Missing translations ==="
            echo -e "$MISSING"
            echo ""
            echo "Please add the missing translations to all locale files."
            exit 1
          fi

          echo "✅ All translations are present in all locale files"

  # ---------------------------------------------------------------------------
  # Unit Tests (pure JVM — no emulator needed, fast)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: [translation-validation]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: android

      - name: Print lint XML report to stdout (rule-ID diagnosis)
        if: always()
        run: |
          XML_REPORT="android/app/build/reports/lint-results-debug.xml"
          if [ -f "$XML_REPORT" ]; then
            echo "=== LINT XML REPORT (rule IDs) ==="
            grep -E '<issue id=|<location' "$XML_REPORT" | head -200 || true
            echo "=== END LINT XML REPORT ==="
          else
            echo "No lint XML report found at $XML_REPORT"
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/lint-baseline.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Kotlin compile check — catches DI wiring, missing resources, broken imports
  # fast without building a full APK
  # ---------------------------------------------------------------------------
  compile-check:
    name: Kotlin Compile Check
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Compile Kotlin sources (debug)
        run: ./gradlew compileDebugKotlin --no-daemon
        working-directory: android

      - name: Compile Kotlin sources (release)
        run: |
          ./gradlew compileReleaseKotlin --no-daemon \
            -PbaseUrl=${{ vars.BACKEND_API_URL || 'https://api.voxquieta.org/' }} \
            -PfrontendUrl=${{ vars.FRONTEND_URL || 'https://voxquieta.org' }}
        working-directory: android

  # ---------------------------------------------------------------------------
  # Instrumented UI Tests — runs on Android emulator, catches Hilt/Compose
  # wiring bugs that JVM unit tests cannot see (e.g. wrong LocalContext type)
  # ---------------------------------------------------------------------------
  instrumented-tests:
    name: Instrumented UI Tests
    runs-on: ubuntu-latest
    needs: [compile-check]
    # Emulator boot + pre-build APKs + tests + teardown can exceed 30 min.
    # Tests themselves finish in ~1 min; most time is emulator lifecycle.
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Enable KVM group for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD so subsequent runs skip the ~2-min AVD-creation step.
      # Key includes api-level, arch, and target so a config change busts the cache.
      - name: Cache AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-default-x86

      - name: Create AVD (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86
          target: default
          avd-name: test-avd
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back
            none
          disable-animations: false
          script: echo "AVD created"

      # Pre-build both APKs (app + test) before the emulator starts.
      # This keeps the emulator step focused on install+run rather than
      # compiling — Gradle's cold compile takes 3-4 min and would eat most
      # of the emulator boot window.
      - name: Pre-build debug APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
        working-directory: android

      # API 29/x86 boots in ~60-90 s on GitHub runners (vs 3-5 min for API 34/x86_64).
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86
          target: default
          avd-name: test-avd
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back
            none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
          working-directory: android

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: android/app/build/outputs/androidTest-results/
          retention-days: 7

  # Android 7 compatibility: install the minSdk build and exercise the production
  # TLS chain through the app's domain-specific network security configuration.
  api-compatibility:
    name: API ${{ matrix.api-level }} Compatibility
    runs-on: ubuntu-latest
    needs: [compile-check]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Enable KVM group for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and test production TLS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86
          target: default
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew installDebug --no-daemon -PbaseUrl=https://api.voxquieta.org/
            adb shell am start -W -n org.voxquieta.debug/org.voxquieta.app.MainActivity
            ./gradlew connectedDebugAndroidTest --no-daemon \
              -PbaseUrl=https://api.voxquieta.org/ \
              -Pandroid.testInstrumentationRunnerArguments.class=org.voxquieta.app.ApiCompatibilityTest
          working-directory: android

  # ---------------------------------------------------------------------------
  # Prod APK build (debuggable, points to production backend), release AAB
  # verification, and APK security flags check.
  # ---------------------------------------------------------------------------
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    # secrets-scan must pass before we ship an APK — a build containing a
    # leaked secret must not produce a downloadable artifact.
    # CVE gating is handled by the nightly android-dependency-check workflow.
    needs: [unit-tests, lint, compile-check, secrets-scan]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Write google-services.json
        uses: ./.github/actions/write-google-services
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build prod APK (debuggable, points to production backend)
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PbaseUrl=${{ vars.BACKEND_API_URL || 'https://api.voxquieta.org/' }} \
            -PfrontendUrl=${{ vars.FRONTEND_URL || 'https://voxquieta.org' }}
        working-directory: android

      - name: Build PR release AAB with ephemeral signing key
        if: github.event_name == 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pr-release.keystore
          KEYSTORE_PASSWORD: pr-build-only # pragma: allowlist secret
          KEY_ALIAS: pr-build
          KEY_PASSWORD: pr-build-only # pragma: allowlist secret
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=PR Build, O=Vox Quieta, C=US"
          VERSION_NAME=$(jq -r '."."' ../.release-please-manifest.json)
          ./gradlew bundleRelease --no-daemon \
            -PversionCode=${{ github.event.pull_request.number || github.run_number }} \
            -PversionName="$VERSION_NAME" \
            -PbaseUrl=https://api.voxquieta.org/
        working-directory: android

      - name: Verify release AAB and merged manifest metadata
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          MANIFEST=""
          while IFS= read -r candidate; do
            if grep -q 'package="org.voxquieta"' "$candidate"; then
              MANIFEST="$candidate"
              break
            fi
          done < <(find android/app/build/intermediates \
            -path '*release*' -name AndroidManifest.xml -type f)
          test -n "$MANIFEST"
          VERSION_NAME=$(jq -r '."."' .release-please-manifest.json)
          grep -q 'android:minSdkVersion="24"' "$MANIFEST"
          grep -q 'android:targetSdkVersion="36"' "$MANIFEST"
          grep -q "android:versionName=\"$VERSION_NAME\"" "$MANIFEST"
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' "$MANIFEST"

      - name: Upload PR release AAB
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: android-pr-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Check AndroidManifest security flags
        run: |
          # Locate the merged manifest produced by AGP
          MANIFEST=$(find android/app/build/intermediates/merged_manifest \
            -name "AndroidManifest.xml" | head -1)

          if [ -z "$MANIFEST" ]; then
            echo "❌ FAIL: merged AndroidManifest.xml not found"
            exit 1
          fi
          echo "Checking manifest: $MANIFEST"

          # allowBackup must be false
          if grep -q 'allowBackup="true"' "$MANIFEST"; then
            echo "❌ FAIL: android:allowBackup is true — must be false"
            exit 1
          fi
          echo "✅ allowBackup=false: OK"

          # usesCleartextTraffic must not be globally true in the merged manifest
          # (cleartext is permitted only for specific dev domains via networkSecurityConfig)
          if grep -q 'usesCleartextTraffic="true"' "$MANIFEST"; then
            echo "⚠️  WARNING: android:usesCleartextTraffic=true found globally — check networkSecurityConfig"
          fi
          echo "✅ Cleartext traffic: restricted via networkSecurityConfig"

          # networkSecurityConfig must be present
          if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
            echo "❌ FAIL: android:networkSecurityConfig is missing"
            exit 1
          fi
          echo "✅ networkSecurityConfig: present"

          echo "✅ All APK security flag checks passed"

      - name: Upload prod APK
        uses: actions/upload-artifact@v7
        with:
          name: android-prod-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Secrets Detection
  # ---------------------------------------------------------------------------
  # Two complementary tools:
  #   1. TruffleHog  – git diff scan for verified secrets (API keys, tokens,
  #      creds). Uses TruffleHog's GitHub Actions auto-detection mode (no
  #      explicit base/head) to avoid shallow-clone SHA resolution failures.
  #   2. detect-secrets – static heuristic scan of the android/ tree checked
  #      against the repo-wide .secrets.baseline; fails on any NEW finding not
  #      already acknowledged in the baseline.
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history required for TruffleHog diff scan

      - name: TruffleHog OSS scan
        # TruffleHog auto-detects PR base/head from GITHUB_BASE_REF/HEAD_REF
        # env vars set by GitHub Actions — no explicit base/head needed.
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          extra_args: --only-verified

      - name: detect-secrets baseline check
        run: | # pragma: allowlist secret
          # Use 1.5.0 — matches the version in the project's .venv (the pre-commit
          # hook pins v1.4.0 but only uses detect-secrets-hook, not detect-secrets
          # scan directly; 1.5.0 adds --baseline support to the scan subcommand).
          pip install detect-secrets==1.5.0

          # Scan android/ against the existing baseline.
          # --baseline causes scan to merge new results into the baseline file;
          # audit --report then exits non-zero on any unreviewed finding.
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files 'android/gradle/wrapper/gradle-wrapper.jar' \
            --exclude-files '.*\.png$' \
            --exclude-files '.*\.jpg$' \
            android/

          # Exit non-zero if there are any unreviewed (new) findings.
          # Note: 'audit' takes the baseline file as a positional arg, not --baseline.
          detect-secrets audit --report .secrets.baseline
