name: Android CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Android CI PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Android CI ({0})', github.ref_name) }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit Tests (pure JVM — no emulator needed, fast)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: android

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Debug APK build (validates the project compiles)
  # ---------------------------------------------------------------------------
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Secrets Detection
  # ---------------------------------------------------------------------------
  # Two complementary tools:
  #   1. TruffleHog  – git diff scan for verified secrets (API keys, tokens,
  #      creds). Uses TruffleHog's GitHub Actions auto-detection mode (no
  #      explicit base/head) to avoid shallow-clone SHA resolution failures.
  #   2. detect-secrets – static heuristic scan of the android/ tree checked
  #      against the repo-wide .secrets.baseline; fails on any NEW finding not
  #      already acknowledged in the baseline.
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history required for TruffleHog diff scan

      - name: TruffleHog OSS scan
        # TruffleHog auto-detects PR base/head from GITHUB_BASE_REF/HEAD_REF
        # env vars set by GitHub Actions — no explicit base/head needed.
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          extra_args: --only-verified

      - name: detect-secrets baseline check
        run: | # pragma: allowlist secret
          # Use 1.5.0 — matches the version in the project's .venv (the pre-commit
          # hook pins v1.4.0 but only uses detect-secrets-hook, not detect-secrets
          # scan directly; 1.5.0 adds --baseline support to the scan subcommand).
          pip install detect-secrets==1.5.0

          # Scan android/ against the existing baseline.
          # --baseline causes scan to merge new results into the baseline file;
          # audit --report then exits non-zero on any unreviewed finding.
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files 'android/gradle/wrapper/gradle-wrapper.jar' \
            --exclude-files '.*\.png$' \
            --exclude-files '.*\.jpg$' \
            android/

          # Exit non-zero if there are any unreviewed (new) findings.
          detect-secrets audit --report --baseline .secrets.baseline
