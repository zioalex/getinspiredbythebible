name: Android Publish

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to publish to (validate = dry-run, no edit committed)."
        required: true
        default: "production"
        type: choice
        options:
          - validate
          - internal
          - alpha
          - beta
          - production
          - extend testing
      version_code:
        description: "Override versionCode (empty = epoch timestamp)."
        required: false
        type: string
      version_name:
        description: "Override versionName (empty = read from build.gradle.kts)."
        required: false
        type: string
      release_status:
        description:
          "Release status: 'completed' (live to testers), 'draft', or empty = per-track default
          (internal/beta=completed, production=draft)."
        required: false
        type: choice
        default: ""
        options:
          - ""
          - completed
          - draft
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

run-name: >-
  ${{ github.event_name == 'push'
      && format('Android Publish {0}', github.ref_name)
      || format('Android Publish → {0} (manual)', inputs.track) }}

permissions:
  contents: read
  actions: read

jobs:
  # Authoritative gate for tag-triggered publishes. Two checks:
  #
  #  1. Version sanity: assert `.release-please-manifest.json` matches the tag
  #     (e.g. tag v1.6.1 ↔ manifest "." = "1.6.1"). Catches release-please tag-
  #     format misconfiguration or any drift between the merged Release PR's
  #     manifest and the pushed tag.
  #
  #  2. Android CI green: wait up to 45 min for Android CI on the *target*
  #     commit to complete with conclusion=success. For release-please merge
  #     commits (subject matches "chore(main): release") the target is the
  #     parent SHA — release-please's own diff is just CHANGELOG + manifest,
  #     so the meaningful CI verdict belongs to the previous main commit,
  #     which already passed Android CI by the time the Release PR was merged.
  #     For any other tag (e.g. a manually-pushed v*.*.* tag) the target is
  #     ${GITHUB_SHA} itself.
  #
  # Skipped for workflow_dispatch — operator-initiated publishes may
  # legitimately run off a non-main branch.
  verify-release-gate:
    name: Verify release gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 50
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # need parent commit for release-please detection

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(jq -r '."."' .release-please-manifest.json)
          echo "Tag: ${TAG} → expected manifest version=${EXPECTED}"
          echo "Found in .release-please-manifest.json: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "❌ Version mismatch: manifest has '${ACTUAL}' but tag says '${EXPECTED}'."
            echo "   Refusing to publish — release-please tag/manifest are out of sync."
            exit 1
          fi
          echo "✅ Manifest version matches tag."

      - name: Determine target SHA for Android CI check
        id: target
        run: |
          MSG=$(git log -1 --pretty=%s "${GITHUB_SHA}")
          echo "Commit subject: ${MSG}"
          if echo "${MSG}" | grep -qE '^chore\((main|master)\): release'; then
            PARENT=$(git rev-parse "${GITHUB_SHA}^")
            echo "Release-please commit — checking Android CI on parent ${PARENT}."
            echo "sha=${PARENT}" >> "$GITHUB_OUTPUT"
          else
            echo "Non-release-please tag — checking Android CI on ${GITHUB_SHA}."
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll Android CI status for target commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.target.outputs.sha }}"
          DEADLINE=$(( $(date +%s) + 2700 )) # 45 min — Android CI itself caps at 55 min
          POLL_INTERVAL=30
          echo "Waiting for Android CI to complete on commit ${SHA}"
          while :; do
            # Most recent android-ci.yml workflow run for this SHA (re-runs win).
            # Filter by .path, not .name: the workflow_runs API returns the
            # *run* name (which uses our dynamic run-name template, e.g.
            # "Android CI (main)"), not the workflow's static name. .path is
            # the workflow file path and is invariant.
            # Emit "status|conclusion" so we can branch on both fields. The
            # "missing" sentinel covers the case where no run exists yet.
            LINE=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.path==".github/workflows/android-ci.yml")]
                    | sort_by(.run_started_at) | last
                    | if . == null then "missing|" else "\(.status)|\(.conclusion // "")" end')
            STATUS="${LINE%|*}"
            CONCLUSION="${LINE#*|}"
            echo "Android CI status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCLUSION}" = "success" ]; then
                echo "✅ Android CI succeeded for ${SHA} — proceeding with publish."
                exit 0
              fi
              echo "❌ Refusing to publish: Android CI for ${SHA} concluded as '${CONCLUSION}'."
              exit 1
            fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "❌ Timed out waiting for Android CI on ${SHA} (last status=${STATUS})."
              exit 1
            fi
            echo "Sleeping ${POLL_INTERVAL}s before re-polling..."
            sleep "${POLL_INTERVAL}"
          done

  publish:
    name: Build & Publish AAB
    runs-on: ubuntu-latest
    needs: [verify-release-gate]
    # `needs` skips dependents when the dep itself is skipped (workflow_dispatch
    # path). Use always() + explicit conclusion check so dispatch runs proceed
    # while a real verify-release-gate failure still blocks publish.
    if: always() && (needs.verify-release-gate.result == 'success' || needs.verify-release-gate.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > /tmp/release.keystore

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Compute version code and name
        id: version
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # versionCode rules from Play Console:
          #   - Each AAB must use a strictly greater versionCode than every
          #     previously-uploaded one (across all tracks) or upload is rejected.
          #   - github.run_number doesn't satisfy this: it stays the same on
          #     workflow re-runs, and can wrap below the manually-uploaded code.
          # Solution: derive versionCode from a Unix-epoch timestamp captured at
          # build time. Always strictly increases per second, never collides
          # across re-runs, and stays well under Android's 2.1B versionCode max
          # for the next ~6 years. versionName stays human-readable (from tag
          # or input or build.gradle.kts).
          BUILD_EPOCH="$(date +%s)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#v}"
          elif [[ -n "$INPUT_VERSION_NAME" ]]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          else
            VERSION_NAME="$(grep versionName android/app/build.gradle.kts \
              | head -1 | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          fi

          if [[ -n "$INPUT_VERSION_CODE" ]]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_CODE="$BUILD_EPOCH"
          fi
          echo "Using versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PbaseUrl="https://api.voxquieta.org/"

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane
        working-directory: android
        run: bundle install --jobs 4 --retry 3

      - name: Decode Google Play JSON key
        run: |
          echo "${{ secrets.GOOGLE_PLAY_JSON_KEY }}" | base64 --decode > /tmp/google-play-key.json

      - name: List available Play Store tracks
        continue-on-error: true
        run: |
          pip install --quiet google-auth google-api-python-client
          python3 android/scripts/play_store_tracks.py list

      - name: Stage latest CHANGELOG entry as default release notes
        # Writes the most-recent CHANGELOG.md release section to
        # android/fastlane/metadata/android/en-US/changelogs/default.txt so
        # fastlane-supply picks it up for whatever versionCode this build uses.
        # Missing/empty release notes is one of the precondition-check failure
        # modes on tracks that require them.
        run: |
          set -e
          mkdir -p android/fastlane/metadata/android/en-US/changelogs
          # Extract the body of the first "## " section in CHANGELOG.md
          # (skip the section header itself; stop at the next "## ").
          # Then trim to the 500-char Play Store maximum.
          awk '
            /^## / { n++; if (n == 1) next; if (n == 2) exit }
            n == 1 { print }
          ' CHANGELOG.md | head -c 500 \
            > android/fastlane/metadata/android/en-US/changelogs/default.txt
          # Fall back to a generic note if the extraction produced nothing.
          if [ ! -s android/fastlane/metadata/android/en-US/changelogs/default.txt ]; then
            echo "Bug fixes and improvements." \
              > android/fastlane/metadata/android/en-US/changelogs/default.txt
          fi
          echo "--- release notes (default.txt) ---"
          cat android/fastlane/metadata/android/en-US/changelogs/default.txt
          echo
          echo "--- end release notes ---"

      - name: Determine Fastlane lane
        id: lane
        # The Play Store track a tag publishes to is a *single dial*: the
        # repository Actions variable ANDROID_AUTO_TRACK. Flip it in
        # Repo → Settings → Secrets and variables → Actions → Variables to
        # advance the app up the ladder (internal → <closed> → beta →
        # production) with no code change. Empty/unset falls back to
        # "internal" so the pipeline is safe by default. Reading a `vars.*`
        # value needs no extra workflow permission.
        #
        # Track → lane mapping: the named tracks have dedicated lanes; any
        # other value (e.g. a custom closed-testing trackId like
        # "extend testing") routes through the closed_testing lane, which
        # reads CLOSED_TESTING_TRACK (set in the upload step below).
        env:
          AUTO_TRACK: ${{ vars.ANDROID_AUTO_TRACK }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TRACK="${AUTO_TRACK:-internal}"
          else
            TRACK="${{ inputs.track }}"
          fi
          echo "Resolving Play Store track '${TRACK}' to a Fastlane lane."
          case "${TRACK}" in
            internal|alpha|beta|production|validate)
              echo "lane=${TRACK}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Custom closed-testing track (e.g. "extend testing").
              echo "lane=closed_testing" >> "$GITHUB_OUTPUT"
              echo "closed_track=${TRACK}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload to Play Store
        working-directory: android
        env:
          GOOGLE_PLAY_JSON_KEY_FILE: /tmp/google-play-key.json
          # Empty value falls through to the lane-specific default in Fastfile
          # (internal/beta = completed, production = draft).
          RELEASE_STATUS: ${{ inputs.release_status }}
          # Set only when the resolved lane is closed_testing; the Fastfile's
          # closed_testing lane reads this and defaults to "alpha" if empty.
          CLOSED_TESTING_TRACK: ${{ steps.lane.outputs.closed_track }}
          # Hide noisy fastlane banner, skip auto-update check, and make
          # supply log the underlying google-api-client HTTP request/response.
          # When upload_to_play_store returns a generic "Precondition check
          # failed", the verbose log contains the actual FAILED_PRECONDITION
          # detail string that identifies which precondition is unmet.
          FASTLANE_HIDE_TIMESTAMP: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          SUPPLY_VERBOSE: "true"
        run: |
          set -o pipefail
          bundle exec fastlane ${{ steps.lane.outputs.lane }} --verbose 2>&1 \
            | tee /tmp/fastlane.log

      - name: Also release build to extra closed tracks
        # On tag-triggered releases, additionally release the *same* build to
        # every track listed in the ANDROID_EXTRA_TRACKS repo variable
        # (comma separated; trackIds may contain spaces) — no rebuild, no new
        # versionCode. This is how
        # one release reaches more than one track at once, e.g. the public
        # Google-Group closed-testing track used to recruit testers, in
        # addition to the primary ANDROID_AUTO_TRACK. Each extra track is
        # served by reusing the Fastfile `promote` lane (skip_upload_aab), so
        # the bit-for-bit build approved on the primary track is the one extra
        # testers receive. Empty/unset = no-op, so the pipeline is unchanged
        # until the variable is set.
        #
        # To find a custom track's trackId: run this workflow via
        # workflow_dispatch once — the "List available Play Store tracks" step
        # prints every trackId — then set ANDROID_EXTRA_TRACKS in
        # Repo → Settings → Secrets and variables → Actions → Variables.
        if: github.event_name == 'push' && vars.ANDROID_EXTRA_TRACKS != ''
        working-directory: android
        env:
          GOOGLE_PLAY_JSON_KEY_FILE: /tmp/google-play-key.json
          FASTLANE_HIDE_TIMESTAMP: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          SUPPLY_VERBOSE: "true"
          # Track the primary upload targeted, used as the promote source.
          PRIMARY_TRACK: ${{ steps.lane.outputs.closed_track || steps.lane.outputs.lane }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXTRA_TRACKS: ${{ vars.ANDROID_EXTRA_TRACKS }}
          # Closed-testing releases go live to all testers immediately.
          RELEASE_STATUS: completed
          ROLLOUT: "1.0"
        run: |
          set -o pipefail
          if [ "${PRIMARY_TRACK}" = "validate" ] || [ -z "${PRIMARY_TRACK}" ]; then
            echo "Primary track is '${PRIMARY_TRACK}' — nothing to promote from. Skipping."
            exit 0
          fi
          # Split on commas ONLY (not whitespace): Play Store trackIds can
          # contain spaces, e.g. "closed-testing google-group". Trim surrounding
          # whitespace from each entry and skip blanks and the primary track
          # (already published above). Process substitution (rather than a pipe
          # into the loop) keeps the loop in this shell so a failed promote can
          # fail the step; FAILED collects per-track failures so one bad track
          # doesn't stop the others but the step still ends non-zero.
          FAILED=""
          while IFS= read -r RAW_TRACK; do
            # Strip leading/trailing whitespace.
            TRACK="$(echo "${RAW_TRACK}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "${TRACK}" ] && continue
            if [ "${TRACK}" = "${PRIMARY_TRACK}" ]; then
              echo "Skipping '${TRACK}' — already published as the primary track."
              continue
            fi
            echo "::group::Promote versionCode ${VERSION_CODE}: ${PRIMARY_TRACK} → ${TRACK}"
            if PROMOTE_VERSION_CODE="${VERSION_CODE}" \
               PROMOTE_FROM="${PRIMARY_TRACK}" \
               PROMOTE_TO="${TRACK}" \
               bundle exec fastlane promote --verbose 2>&1 | tee -a /tmp/fastlane.log; then
              echo "✅ Promoted to '${TRACK}'."
            else
              echo "❌ Failed to promote to '${TRACK}'."
              FAILED="${FAILED} '${TRACK}'"
            fi
            echo "::endgroup::"
          done < <(echo "${EXTRA_TRACKS}" | tr ',' '\n')
          if [ -n "${FAILED}" ]; then
            echo "Promotion failed for tracks:${FAILED}"
            exit 1
          fi

      - name: Report Play Store track status
        # Read-only post-upload visibility. A successful `supply` upload only
        # proves Google *accepted* the edit — not that the release went live to
        # testers. Google can hold a release "in review", leave it as a draft,
        # or stage a partial rollout, and none of that surfaces in the upload
        # log. This step opens a throwaway edit and prints, for every track,
        # each release's status + rollout fraction + versionCodes, so "live at
        # full rollout" vs "stuck in review" is visible in the run instead of
        # guessed. Mirrors the "List available Play Store tracks" step's auth
        # and teardown — it commits nothing (the edit is abandoned at the end).
        # always() + continue-on-error: purely diagnostic, must never fail the
        # job nor be skipped when an earlier step failed.
        if: ${{ always() }}
        continue-on-error: true
        run: |
          pip install --quiet google-auth google-api-python-client
          python3 android/scripts/play_store_tracks.py status

      - name: Upload Fastlane log on failure
        # Captures the verbose fastlane log + any report.xml so the underlying
        # Google Play API HTTP response body is available for post-mortem when
        # upload_to_play_store fails.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fastlane-log-${{ github.run_id }}
          path: |
            /tmp/fastlane.log
            android/fastlane/report.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ steps.version.outputs.version_name }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
