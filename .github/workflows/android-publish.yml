name: Android Publish

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - beta
          - production
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

run-name: >-
  ${{ github.event_name == 'push'
      && format('Android Publish {0}', github.ref_name)
      || format('Android Publish → {0} (manual)', inputs.track) }}

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > /tmp/release.keystore

      - name: Compute version code from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3
            VERSION_NAME="${TAG#v}"           # e.g. 1.2.3
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            VERSION_NAME="$(grep versionName android/app/build.gradle.kts | head -1 | grep -oP '[\d.]+')"
            VERSION_CODE="$(grep versionCode android/app/build.gradle.kts | head -1 | grep -oP '\d+')"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PbaseUrl="https://api.voxquieta.org/"

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane
        working-directory: android
        run: gem install fastlane --no-document

      - name: Decode Google Play JSON key
        run: |
          echo "${{ secrets.GOOGLE_PLAY_JSON_KEY }}" | base64 --decode > /tmp/google-play-key.json

      - name: Determine Fastlane lane
        id: lane
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "lane=internal" >> "$GITHUB_OUTPUT"
          else
            echo "lane=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Play Store
        working-directory: android
        env:
          GOOGLE_PLAY_JSON_KEY_FILE: /tmp/google-play-key.json
        run: fastlane ${{ steps.lane.outputs.lane }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_name }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
