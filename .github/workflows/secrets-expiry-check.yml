name: Secrets Expiry Check

# BITB-305: weekly check of docs/secrets-inventory.yaml (names and dates only, never values).
#
# Scheduled / manual run:
#   1. scripts/check_secrets_inventory.py  -> fails when any `expires` is past or within 21 days.
#      `--allow-unknown` is set while the owner fills in the real dates. OWNER TODO: remove
#      --allow-unknown once every entry has a date, so `unknown` fails the check.
#   2. Live header check for the GitHub PATs RELEASE_PLEASE_TOKEN and AUTO_UPDATE_PR_TOKEN.
#      GET /user with the PAT returns `github-authentication-token-expiration`; only that header
#      value (never the token) is handed to the script, which compares it with the inventory and
#      fails on a mismatch or a date inside 21 days. A secret that is unset is skipped. A token
#      with no expiry returns no header and must be recorded as `expires: never`.
#
# Pull requests (path-filtered): ONLY the unit tests, schema validation and --completeness
# (every secret referenced by a workflow has an inventory entry). The date check never runs on a
# PR: PRs must never go red because time passed (same rationale as crisis-resources-staleness.yml).
#
# Manual run: Actions -> Secrets Expiry Check -> Run workflow.
# Local run:  python3 scripts/check_secrets_inventory.py --allow-unknown

# yamllint flags the unquoted `on` key as a YAML 1.1 truthy value.
"on":
  schedule:
    # Mondays 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/**"
      - "deployment/**/*.tf"
      - "docs/secrets-inventory.yaml"
      - "scripts/check_secrets_inventory.py"
      - "scripts/test_check_secrets_inventory.py"

permissions:
  contents: read

concurrency:
  group: secrets-expiry-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory-gate:
    name: Inventory schema, completeness and unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest pyyaml

      - name: Unit tests
        run: python -m pytest scripts/test_check_secrets_inventory.py -v

      - name: Schema and completeness (no date checks)
        run: python scripts/check_secrets_inventory.py --completeness

  expiry:
    name: Check recorded and live expiry dates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Completeness
        run: python scripts/check_secrets_inventory.py --completeness

      # OWNER TODO: drop --allow-unknown once all dates are recorded.
      - name: Recorded expiry dates
        run: python scripts/check_secrets_inventory.py --allow-unknown

      - name: Live GitHub PAT expiry headers
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          AUTO_UPDATE_PR_TOKEN: ${{ secrets.AUTO_UPDATE_PR_TOKEN }}
        run: |
          set -u
          status=0
          for name in RELEASE_PLEASE_TOKEN AUTO_UPDATE_PR_TOKEN; do
            token="${!name}"
            if [ -z "$token" ]; then
              echo "::notice::$name is not set; skipping live check"
              continue
            fi
            echo "::add-mask::$token"
            http_code=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user) || {
              echo "::error::$name: request to api.github.com failed"
              status=1
              continue
            }
            if [ "$http_code" != "200" ]; then
              echo "::error::$name: GET /user returned HTTP $http_code (expired, revoked or invalid token)"
              status=1
              continue
            fi
            value=$(tr -d '\r' < headers.txt \
              | grep -i '^github-authentication-token-expiration:' \
              | head -n1 | cut -d: -f2- | sed 's/^ *//')
            rm -f headers.txt
            python scripts/check_secrets_inventory.py --allow-unknown \
              --live-header "$name=${value:-none}" || status=1
          done
          exit "$status"
