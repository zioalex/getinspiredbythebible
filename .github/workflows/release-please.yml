name: Release Please

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # RELEASE_PLEASE_TOKEN must be a PAT with `contents: write` and `workflows: write`
          # so that the tag it creates can trigger the `on: push: tags` in android-publish.yml.
          # GITHUB_TOKEN-created tags do NOT trigger downstream tag-based workflows.
          # See docs/RELEASE_PROCESS.md for setup instructions.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

          # ── Fallback: approach (b) — dispatch android-publish.yml instead of using a PAT ──
          # If you prefer not to use a PAT, remove the token line above (revert to
          # secrets.GITHUB_TOKEN) and uncomment the step below. It dispatches the
          # android-publish workflow explicitly when a release is created, working
          # around the limitation that GITHUB_TOKEN-pushed tags don't trigger workflows.

# yamllint disable rule:comments-indentation
