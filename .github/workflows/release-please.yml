#         run: |
#           gh workflow run android-publish.yml \
#             --repo "${{ github.repository }}" \
#             --ref "${{ needs.release-please.outputs.tag_name }}"
#         env:
#           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# yamllint enable rule:comments-indentation
