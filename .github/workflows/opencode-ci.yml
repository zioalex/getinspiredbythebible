name: CI - opencode Agent Config

# yamllint disable-line rule:truthy
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('opencode-ci PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('opencode-ci {0} ({1})', github.ref_name, github.sha) }}

# BITB-129. Fast, hermetic checks for agent-config changes: no database, no
# Docker, no Node matrix, no secrets. These paths previously either ran the
# entire application suite (deployment/**, scripts/**) or nothing at all
# (.opencode/**, opencode.json).
"on":
  pull_request:
    branches:
      - main
      - feature/**
    paths:
      - ".opencode/**"
      - "opencode.json"
      - "scripts/generate-opencode-config.py"
      - "scripts/test_generate_opencode_config.py"
      - "scripts/test_kubeopencode_manifests.py"
      - "scripts/test_kubeopencode_netpol.py"
      - "scripts/verify-kubeopencode-netpol.sh"
      - "scripts/test_cluster_triage.py"
      - "scripts/collect-k8s-diagnostics.sh"
      - "scripts/test-opencode-config-live.py"
      - "Makefile"
      - "docs/RUNBOOK-CLUSTER-TRIAGE.md"
      - "k8s/kubeopencode/**"
      - "docs/SECURITY-KUBEOPENCODE.md"
      - "k8s/dns-watchdog/**"
      - "scripts/test_dns_watchdog.py"
      - ".github/workflows/opencode-ci.yml"
  push:
    branches:
      - main
    paths:
      - ".opencode/**"
      - "opencode.json"
      - "scripts/generate-opencode-config.py"
      - "scripts/test_generate_opencode_config.py"
      - "scripts/test_kubeopencode_manifests.py"
      - "scripts/test_kubeopencode_netpol.py"
      - "scripts/verify-kubeopencode-netpol.sh"
      - "scripts/test_cluster_triage.py"
      - "scripts/collect-k8s-diagnostics.sh"
      - "scripts/test-opencode-config-live.py"
      - "Makefile"
      - "docs/RUNBOOK-CLUSTER-TRIAGE.md"
      - "k8s/kubeopencode/**"
      - "docs/SECURITY-KUBEOPENCODE.md"
      - "k8s/dns-watchdog/**"
      - "scripts/test_dns_watchdog.py"
      - ".github/workflows/opencode-ci.yml"

permissions:
  contents: read

jobs:
  opencode-config:
    name: opencode Config & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      # The generator imports PyYAML, which is not in the stdlib. Without this
      # the generator dies with ModuleNotFoundError and a naive drift check
      # would compare against empty output and report a false drift.
      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # BITB-269 / T-1254PLG: the task-reliability plugin's export surface is
      # a runtime contract of the opencode 1.18.31 plugin loader (exactly one
      # default function export; helpers live in task-reliability-helpers.ts).
      # The 2026-11-08 live incident (plugin rejected with `Plugin export is
      # not a function` after a pre-merge config sync) shipped because these
      # tests only ever ran ad-hoc on the pod — never in CI. The suite also
      # pins the empirical 1.18.31 event shape (`properties.info.parentID`)
      # that arms the stuck-child watchdog.
      - name: task-reliability plugin tests (loader contract + helpers)
        run: node --experimental-strip-types --test .opencode/plugin/task-reliability.test.ts

      - name: Generator regression tests
        run: python -m pytest scripts/test_generate_opencode_config.py -v

      - name: Manifest and committed-artifact tests
        run: python -m pytest scripts/test_kubeopencode_manifests.py -v

      # BITB-152. The strict tier took the cluster down twice, both times because
      # a podSelector named the wrong label and the pods it missed were left with
      # no egress at all. These assert the selector invariants without a cluster;
      # `make verify-kubeopencode-netpol` checks the same guarantees against a
      # live one, which CI has no kubeconfig for.
      - name: NetworkPolicy selector tests
        run: python -m pytest scripts/test_kubeopencode_netpol.py -v

      # BITB-159. Static checks on the CoreDNS watchdog: RBAC scope, the
      # bootstrap trap (no DNS-name dependency to reach the API server), all
      # four probe legs present, and every AUTO_RESTART/FAILURE_THRESHOLD/
      # RESTART_COOLDOWN_SECONDS knob wired in both the script and the
      # Deployment env. No cluster needed.
      # BITB-160. Guards the collector against leaking Secret values and the
      # runbook against losing traps that each cost hours to find.
      - name: Cluster triage tooling tests
        run: python -m pytest scripts/test_cluster_triage.py -v

      - name: DNS watchdog tests
        run: python -m pytest scripts/test_dns_watchdog.py -v

      # Guards the 12-agent count, fallback_models on every agent, and the
      # runtime-fallback plugin. Without the plugin, fallback_models is inert.
      - name: Verify generated config
        run: make verify-opencode-config

      # verify-opencode-config regenerates opencode.json in place, so any
      # difference from the committed artifact shows up here as a dirty tree.
      - name: Check committed opencode.json is in sync
        run: |
          if ! git diff --exit-code --stat opencode.json; then
            msg="opencode.json is out of sync with .opencode/agents/*.md."
            msg="$msg Run 'make gen-opencode-config' and commit the result."
            echo "::error file=opencode.json::$msg"
            git diff opencode.json
            exit 1
          fi
          echo "opencode.json is in sync with .opencode/agents/*.md"

  # BITB-280. The 2026-11-08 18:51 incident: a plugin with 26 green unit tests
  # was dead on arrival in the live opencode 1.18.31 loader ("Plugin export is
  # not a function"). Static tests cannot see the runtime contract, so this job
  # boots a SCRATCH opencode instance against the tree's COMMITTED opencode.json
  # and asserts the runtime accepts it. The self-test injects the exact 18:51
  # bug into a plugin copy and REQUIRES the gate to catch it — the job is green
  # only if the injected bug is detected.
  opencode-live-gate:
    name: opencode Live Config Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The gate's [5/8] step invokes `make verify-opencode-config`, whose
      # generator imports PyYAML (not in the stdlib).
      - name: Install dependencies
        run: pip install pyyaml pytest

      # The pinned version lives in scripts/test-opencode-config-live.py
      # (PINNED_OPENCODE_VERSION) and must track the pod's opencode version
      # (the oc<x.y.z> suffix of agentImage in k8s/kubeopencode/agent-default-wf2.yaml).
      # The gate itself fails if binary, constant, and agent.yaml disagree.
      - name: Install the pinned opencode binary
        run: npm install -g "opencode-ai@$(python3 scripts/test-opencode-config-live.py --print-version)"

      - name: Live gate (normal mode)
        run: make test-opencode-config-live

      - name: Live gate self-test (must catch the injected 18:51 bug)
        run: make test-opencode-config-live-selftest
