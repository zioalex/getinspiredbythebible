name: Pre-Commit Validation

# yamllint disable-line rule:truthy
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Pre-commit PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Pre-commit {0} ({1})', github.ref_name, github.sha) }}

"on":
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  pre-commit:
    name: Pre-Commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: SKIP=hadolint-docker pre-commit run --all-files --show-diff-on-failure

      - name: Install PyYAML for env validation
        run: pip install pyyaml

      - name: Validate environment variables
        run: python scripts/validate-env.py --verbose
