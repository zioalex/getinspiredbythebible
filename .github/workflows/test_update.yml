name: CI/CD - Test Application

# yamllint disable-line rule:truthy
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Tests PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Tests {0} ({1})', github.ref_name, github.sha) }}

"on":
  pull_request:
    branches:
      - main
      - feature/**
    paths:
      - "api/**"
      - "frontend/**"
      - "tests/**"
      - "docker-compose*.yml"
      - "scripts/**"
      - ".github/workflows/test_update.yml"
  push:
    branches:
      - main
      - feature/initial-implementation
    paths:
      - "api/**"
      - "frontend/**"
      - "tests/**"
      - "docker-compose*.yml"
      - "scripts/**"
      - ".github/workflows/test_update.yml"

jobs:
  # Backend API Tests
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bible
          POSTGRES_PASSWORD: bible123 # pragma: allowlist secret
          POSTGRES_DB: bibledb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Guard — prod Application Insights must remain enabled (BITB-055)
        run: |
          # Prevent someone from accidentally disabling the alert layer by setting
          # enable_application_insights = false in terraform.tfvars. All metric-based
          # and log-based Azure Monitor alerts are gated on this flag; disabling it
          # silently turns off prod monitoring.
          if grep -qE '^\s*enable_application_insights\s*=\s*false' deployment/terraform.tfvars; then
            msg="enable_application_insights is disabled — this silently turns off all"
            msg="$msg prod Azure Monitor alerts (BITB-055 guard). Re-enable it or remove the line."
            echo "::error file=deployment/terraform.tfvars::$msg"
            exit 1
          fi
          echo "Guard passed: enable_application_insights is not disabled in terraform.tfvars"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install dependencies
        run: |
          cd api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black==26.1.0 mypy types-PyYAML

      - name: Lint with Ruff
        run: |
          cd api
          ruff check . --select E,F,W,C90,I,N --ignore E501

      - name: Format check with Black
        run: |
          cd api
          black --check --diff .

      - name: Type check with MyPy
        run: |
          cd api
          mypy . --ignore-missing-imports --no-strict-optional

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://bible:bible123@localhost:5432/bibledb # pragma: allowlist secret
          LLM_PROVIDER: ollama
          OLLAMA_HOST: http://localhost:11434
          # BITB-061: this job's Postgres service has no migrations applied, so
          # the shared rate-limit tables don't exist. Route-level tests that
          # exercise require_rate_limit() would otherwise hit real DB errors
          # until the circuit breaker trips and fails closed for the rest of
          # the session. test_rate_limiter*.py exercise the postgres backend
          # explicitly (backend="postgres") regardless of this default.
          RATE_LIMIT_BACKEND: memory
        run: |
          cd api
          pytest -v --tb=short

      - name: Test API syntax and imports
        env:
          DATABASE_URL: postgresql://bible:bible123@localhost:5432/bibledb # pragma: allowlist secret
          LLM_PROVIDER: ollama
          OLLAMA_HOST: http://localhost:11434
        run: |
          cd api
          python -c "import main; import config; print('✓ Core modules import successfully')"
          python -c "from routes import chat, scripture; print('✓ Route modules import successfully')"
          python -c "from providers import factory; print('✓ Provider modules import successfully')"
          python -c "from scripture import repository, search; print('✓ Scripture modules import successfully')"

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run unit tests
        run: |
          cd frontend
          npm run test:unit

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build

  # Integration Tests
  # Only run after unit tests pass to save CI resources
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create .env file
        run: | # pragma: allowlist secret
          # Create .env at root for docker compose
          # Matches production: OpenRouter for LLM, Ollama for embeddings
          # Primary: free model, Fallback: paid model (minimal cost)
          cat > .env << EOF
          LLM_PROVIDER=openrouter
          OPENROUTER_API_KEY=${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
          OPENROUTER_MODEL=meta-llama/llama-3.3-70b-instruct:free
          OPENROUTER_FALLBACK_MODELS=meta-llama/llama-3.3-70b-instruct
          OPENROUTER_ALLOW_FALLBACKS=true
          # docker-compose.yml already defaults to this, but pin it explicitly so this
          # job keeps working even if that default changes. This ephemeral, single-
          # instance Postgres has no pg_cron purge job (migration 010, BITB-061) for
          # the Postgres-backed rate limiter's tables, and (the original incident)
          # once had neither table at all -- which tripped the limiter's circuit
          # breaker to fail closed (real 429s) after 5 chat/stream requests.
          RATE_LIMIT_BACKEND=memory
          OLLAMA_HOST=http://ollama:11434
          EMBEDDING_PROVIDER=ollama
          EMBEDDING_MODEL=mxbai-embed-large
          DATABASE_URL=postgresql://bible:bible123@postgres:5432/bibledb  # pragma: allowlist secret
          EOF
          # Also copy to api folder
          cp .env api/.env

      - name: Start all services
        run: |
          docker compose up -d
          echo "Waiting for services to initialize..."
          sleep 30

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama to pull embedding model (this may take a few minutes)..."
          max_attempts=60
          attempt=0
          until curl -sf http://localhost:11434/api/tags | grep -q "mxbai-embed-large"; do
            attempt=$((attempt + 1))
            if [ $attempt -eq $max_attempts ]; then
              echo "Ollama failed to be ready with embedding model"
              docker compose logs ollama
              exit 1
            fi
            echo "Waiting for Ollama embedding model... attempt $attempt/$max_attempts"
            sleep 10
          done
          echo "Ollama is ready with mxbai-embed-large embedding model!"
          echo "Note: Using OpenRouter for LLM (matches production config)"
          curl -s http://localhost:11434/api/tags | jq .

      - name: Load CI test data (1 Corinthians with embeddings)
        run: |
          echo "Loading 1 Corinthians with embeddings for semantic search testing..."
          cd scripts
          pip install httpx asyncpg sqlalchemy
          # Load WEB translation (app default) - only 1 Corinthians (CI mode)
          python load_bible.py --ci --translation web
          # Generate embeddings for the loaded verses
          python create_embeddings.py --ci
        env:
          DATABASE_URL: postgresql://bible:bible123@localhost:5432/bibledb # pragma: allowlist secret
          OLLAMA_HOST: http://localhost:11434
          EMBEDDING_MODEL: mxbai-embed-large
          EMBEDDING_DIMENSIONS: 1024

      - name: Test API health endpoint
        run: |
          max_attempts=30
          attempt=0
          until curl -f http://localhost:8000/health || [ $attempt -eq $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Waiting for API... attempt $attempt/$max_attempts"
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "API failed to start"
            docker compose logs api
            exit 1
          fi

      - name: Debug - Check API configuration
        run: |
          echo "=== API Configuration ==="
          curl -sf http://localhost:8000/config | jq .
          echo ""
          echo "=== Health Check Details ==="
          curl -sf http://localhost:8000/health | jq .
          echo ""
          echo "=== Environment Variables in API container ==="
          docker compose exec -T api env | grep -E "(LLM|OPENROUTER|EMBEDDING)" | \
            sed 's/API_KEY=.*/API_KEY=***REDACTED***/'

      - name: Run all endpoint tests in parallel
        run: |
          # Create test scripts directory
          mkdir -p /tmp/tests

          # Test 1: Health & Config endpoints
          cat > /tmp/tests/test_health.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "=== Testing Health Endpoint ==="
          health_response=$(curl -sf http://localhost:8000/health)
          echo "$health_response" | jq .
          status=$(echo "$health_response" | jq -r '.status')
          # Accept "healthy" or "degraded" (LLM may be slow in CI)
          # Only fail on "unhealthy" (database down)
          if [ "$status" = "unhealthy" ]; then
            echo "ERROR: API status is unhealthy (critical dependency down)"
            exit 1
          fi
          echo "✓ Health endpoint OK (status: $status)"

          echo ""
          echo "=== Testing Config Endpoint ==="
          config_response=$(curl -sf http://localhost:8000/config)
          echo "$config_response" | jq .
          if echo "$config_response" | jq -e '.llm.provider' > /dev/null; then
            echo "✓ Config endpoint OK"
          else
            echo "ERROR: Config response missing expected fields"
            exit 1
          fi
          SCRIPT

          # Test 2: Scripture search endpoint
          cat > /tmp/tests/test_scripture.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "=== Testing Scripture Search Endpoint ==="
          search_response=$(curl -sf "http://localhost:8000/api/v1/scripture/search?q=love")
          echo "$search_response" | jq .
          echo "✓ Scripture search endpoint OK"
          SCRIPT

          # Test 3: Chat endpoint
          cat > /tmp/tests/test_chat.sh << 'SCRIPT'
          #!/bin/bash
          echo "=== Testing Chat Endpoint ==="
          # Use -w to capture HTTP status code separately
          http_code=$(curl -s -o /tmp/chat_response.json -w "%{http_code}" \
            -X POST http://localhost:8000/api/v1/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "What does the Bible say about love?"}' \
            --max-time 180)

          echo "HTTP Status Code: $http_code"
          echo "Chat response:"
          cat /tmp/chat_response.json | jq . 2>/dev/null || cat /tmp/chat_response.json

          # Accept 200 (success) or 503/500 (LLM unavailable - expected in CI)
          if [ "$http_code" = "200" ]; then
            if cat /tmp/chat_response.json | jq -e '.message' > /dev/null 2>&1; then
              echo "✓ Chat endpoint responded successfully!"
              # Verify semantic search returned verses (not empty)
              verse_count=$(cat /tmp/chat_response.json | jq '.scripture_context.verses | length')
              echo "Scripture verses found: $verse_count"
              if [ "$verse_count" -gt 0 ]; then
                echo "✓ Semantic search working - found $verse_count verses!"
                # Show first verse for verification
                cat /tmp/chat_response.json | jq '.scripture_context.verses[0]'
              else
                echo "⚠ WARNING: No verses returned - semantic search may not be working"
                echo "This could indicate embedding issues"
              fi
            else
              echo "ERROR: Chat response missing 'message' field"
              exit 1
            fi
          elif [ "$http_code" = "503" ] || [ "$http_code" = "500" ]; then
            echo "⚠ Chat endpoint returned $http_code (LLM may be unavailable - acceptable in CI)"
            echo "✓ Chat endpoint is reachable"
          else
            echo "ERROR: Chat endpoint returned unexpected HTTP $http_code"
            exit 1
          fi
          SCRIPT

          # Test 4: Chat streaming endpoint
          cat > /tmp/tests/test_stream.sh << 'SCRIPT'
          #!/bin/bash
          echo "=== Testing Chat Streaming Endpoint ==="
          http_code=$(curl -s -o /tmp/stream_response.txt -w "%{http_code}" \
            -X POST http://localhost:8000/api/v1/chat/stream \
            -H "Content-Type: application/json" \
            -d '{"message": "Say hello"}' \
            --max-time 60 || echo "000")

          echo "HTTP Status Code: $http_code"
          if [ -s /tmp/stream_response.txt ]; then
            echo "Stream response received:"
            head -c 500 /tmp/stream_response.txt
            echo ""
            echo "✓ Chat streaming endpoint OK"
          else
            echo "WARNING: Streaming endpoint returned empty (may be expected)"
          fi
          SCRIPT

          # Test 5: Frontend health
          # Test root path / which should redirect to /en (i18n locale detection).
          # Uses -L to follow the redirect. First request triggers compilation (~6s).
          cat > /tmp/tests/test_frontend.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "=== Testing Frontend ==="
          max_attempts=30
          attempt=0
          # Wait for Next.js dev server - hit / which redirects to /en via locale detection
          until curl -s -L -o /dev/null --max-time 30 -w "%{http_code}" http://localhost:3000/ | grep -qE "^200"; do
            attempt=$((attempt + 1))
            if [ $attempt -eq $max_attempts ]; then
              echo "Frontend failed to start"
              docker compose logs frontend --tail=50
              exit 1
            fi
            echo "Waiting for Frontend... attempt $attempt/$max_attempts"
            sleep 2
          done
          echo "✓ Frontend root redirect OK (/ → /en)"

          # Also verify a non-default locale works
          http_code=$(curl -s -o /dev/null --max-time 30 -w "%{http_code}" http://localhost:3000/it)
          if [ "$http_code" = "200" ]; then
            echo "✓ Frontend locale /it OK"
          else
            echo "ERROR: /it returned HTTP $http_code"
            exit 1
          fi
          SCRIPT

          chmod +x /tmp/tests/*.sh

          # Run tests in parallel
          echo "Running all tests in parallel..."
          /tmp/tests/test_health.sh > /tmp/tests/health.log 2>&1 &
          pid_health=$!
          /tmp/tests/test_scripture.sh > /tmp/tests/scripture.log 2>&1 &
          pid_scripture=$!
          /tmp/tests/test_chat.sh > /tmp/tests/chat.log 2>&1 &
          pid_chat=$!
          /tmp/tests/test_stream.sh > /tmp/tests/stream.log 2>&1 &
          pid_stream=$!
          /tmp/tests/test_frontend.sh > /tmp/tests/frontend.log 2>&1 &
          pid_frontend=$!

          # Wait for all tests and collect results
          failed=0

          wait $pid_health || { echo "❌ Health test failed"; failed=1; }
          cat /tmp/tests/health.log

          wait $pid_scripture || { echo "❌ Scripture test failed"; failed=1; }
          cat /tmp/tests/scripture.log

          wait $pid_chat || { echo "❌ Chat test failed"; failed=1; }
          cat /tmp/tests/chat.log

          wait $pid_stream || { echo "❌ Stream test failed"; failed=1; }
          cat /tmp/tests/stream.log

          wait $pid_frontend || { echo "❌ Frontend test failed"; failed=1; }
          cat /tmp/tests/frontend.log

          # Always show API logs for debugging
          echo ""
          echo "=== API Backend Logs ==="
          docker compose logs api --tail=100

          if [ $failed -eq 1 ]; then
            echo ""
            echo "Some tests failed!"
            exit 1
          fi

          echo ""
          echo "✅ All tests passed!"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Ollama Logs ==="
          docker compose logs ollama
          echo "=== API Logs ==="
          docker compose logs api
          echo "=== Frontend Logs ==="
          docker compose logs frontend
          echo "=== PostgreSQL Logs ==="
          docker compose logs postgres

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  # Security & Dependencies Check
  security-check:
    name: Security & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python dependencies for vulnerabilities
        run: |
          cd api
          pip install safety
          # Policy file (api/.safety-policy.yml) handles CVE ignores and satisfies
          # safety's requirement for a policy file when run inside a git repo
          safety check -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Check npm dependencies for vulnerabilities
        run: |
          cd frontend
          npm audit --audit-level=high

  # Search-Eval Golden Set Validation (BITB-051 P2)
  # Non-blocking: validates the dataset file structure without DB or secrets.
  search-eval-validate:
    name: Search-Eval Golden Set Validate
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Validate golden set (no DB required)
        env:
          DATABASE_URL: postgresql://bible:bible123@localhost:5432/bibledb # pragma: allowlist secret
        run: |
          python scripts/run_search_eval.py --validate
