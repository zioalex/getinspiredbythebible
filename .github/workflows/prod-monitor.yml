name: Prod Monitor

# Production monitoring + alerting via Telegram.
#
# Six independent jobs run every 5 minutes:
#   - health        : cheap liveness check (/health/live, /health/ready)
#   - synthetic-chat: real chat round-trip via /api/v1/chat/stream — catches
#                     the failure mode where the backend returns HTTP 200 with
#                     an in-band {"type":"error", ...} SSE chunk (e.g. a bad
#                     OpenRouter API key).
#   - cross-origin-smoke: browser-shaped probe — sends the real CORS preflight
#                     (OPTIONS with Origin) then a cross-origin POST to
#                     /api/v1/chat/stream. Catches browser-only outages that
#                     direct httpx/curl probes miss (e.g. the 2026-07-05
#                     _IncludedRouter 500 on preflight, BITB-064).
#   - verse-search  : semantic search probe via /api/v1/scripture/search —
#                     validates DB + embedding provider + pgvector are healthy.
#   - frontend      : checks that the frontend (voxquieta.org) serves HTML.
#   - log-scan      : Azure Log Analytics KQL query against the backend's
#                     ContainerAppConsoleLogs_CL for error patterns over the
#                     last 10 minutes.
#
# Each job sends a Telegram message on transition pass→fail or fail→pass.
# State is stored in the gh-monitor-state branch (one tiny file per job) so
# repeated failures don't spam the chat.
#
# Required repo secrets:
#   TELEGRAM_BOT_TOKEN   - existing Telegram bot token (e.g. shared with N8N)
#   TELEGRAM_CHAT_ID     - chat/group ID where alerts land (negative for groups)
#   MONITOR_PROBE_SECRET - shared secret for the synthetic chat probe; must
#                          match settings.monitor_probe_secret in the deployed
#                          backend (wired via TF_VAR_monitor_probe_secret in
#                          azure-deploy.yml)
#   ARM_CLIENT_ID / ARM_CLIENT_SECRET / ARM_TENANT_ID / ARM_SUBSCRIPTION_ID
#                        - service principal for the log-scan job (already
#                          used by azure-deploy.yml)
#
# Required repo variables (vars.*):
#   BACKEND_URL          - e.g. https://bible-app-backend.<region>.azurecontainerapps.io
#                          (default: production hardcoded fallback below)
#
# Manual run:
#   Actions → Prod Monitor → Run workflow
#   (also useful for testing the Telegram setup with workflow_dispatch + force_alert=true)

# yamllint flags the unquoted `on` key as a YAML 1.1 truthy value.
"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Send a test alert to Telegram regardless of probe outcome"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  # Allow scheduled runs to overlap minimally; manual runs take priority.
  group: prod-monitor-${{ github.workflow }}
  cancel-in-progress: false

env:
  BACKEND_URL:
    ${{ vars.BACKEND_URL || 'https://bible-app-backend.agreeablesea-6ee07535.northeurope.azurecontainerapps.io' }}
  STATE_BRANCH: gh-monitor-state

jobs:
  # ---------------------------------------------------------------------------
  health:
    name: Health probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Required so `uses: ./.github/actions/notify-telegram` can resolve the
      # local composite action — without checkout, the runner has no repo files.
      - uses: actions/checkout@v6

      - name: Check /health/live
        id: live
        run: |
          set -o pipefail
          body=$(curl -fsS --max-time 10 "${BACKEND_URL%/}/health/live")
          echo "$body"
          echo "$body" | grep -q '"alive"' || {
            echo "live response missing 'alive': $body" > "$RUNNER_TEMP/detail.txt"
            exit 1
          }

      - name: Check /health/ready
        id: ready
        run: |
          set -o pipefail
          body=$(curl -fsS --max-time 10 "${BACKEND_URL%/}/health/ready")
          echo "$body"
          echo "$body" | grep -q '"ready"' || {
            echo "ready response missing 'ready': $body" > "$RUNNER_TEMP/detail.txt"
            exit 1
          }

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          job_status: ${{ job.status }}
          job_name: health
          state_branch: ${{ env.STATE_BRANCH }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          force_alert: ${{ github.event.inputs.force_alert }}

  # ---------------------------------------------------------------------------
  synthetic-chat:
    name: Synthetic chat probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe deps
        run: pip install httpx

      - name: Run synthetic chat probe
        id: probe
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}
          MONITOR_PROBE_SECRET: ${{ secrets.MONITOR_PROBE_SECRET }}
          # Must be a real scripture prompt: the probe asserts the response cites/
          # resolves verses (PROBE_REQUIRE_VERSES defaults to 1, BITB-055). A greeting
          # like "hi" only sometimes elicits a citation, so it produced nondeterministic
          # false failures. A direct verse question deterministically exercises — and
          # asserts on — the scripture-retrieval path the probe is meant to guard.
          PROBE_MESSAGE: "What does John 3:16 say?"
          PROBE_TIMEOUT_SECONDS: "30"
          PROBE_FIRST_CHUNK_SECONDS: "20"
        run: python scripts/monitor/synthetic_chat.py --detail-out "$RUNNER_TEMP/detail.txt"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          job_status: ${{ job.status }}
          job_name: synthetic-chat
          state_branch: ${{ env.STATE_BRANCH }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          force_alert: ${{ github.event.inputs.force_alert }}

  # ---------------------------------------------------------------------------
  cross-origin-smoke:
    name: Cross-origin smoke probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe deps
        run: pip install httpx

      - name: Run cross-origin smoke probe
        id: probe
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}
          MONITOR_PROBE_SECRET: ${{ secrets.MONITOR_PROBE_SECRET }}
          # The browser Origin that hits the API. Must be an allowed CORS origin;
          # the probe fails if the preflight doesn't echo it back.
          PROBE_ORIGIN: "https://voxquieta.org"
          PROBE_MESSAGE: "What does John 3:16 say?"
          PROBE_TIMEOUT_SECONDS: "30"
          PROBE_FIRST_CHUNK_SECONDS: "20"
        run: python scripts/monitor/synthetic_preflight.py --detail-out "$RUNNER_TEMP/detail.txt"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          job_status: ${{ job.status }}
          job_name: cross-origin-smoke
          state_branch: ${{ env.STATE_BRANCH }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          force_alert: ${{ github.event.inputs.force_alert }}

  # ---------------------------------------------------------------------------
  verse-search:
    name: Verse search probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe deps
        run: pip install httpx

      - name: Run verse search probe
        id: probe
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}
          MONITOR_PROBE_SECRET: ${{ secrets.MONITOR_PROBE_SECRET }}
          SEARCH_QUERY: "love"
          SEARCH_TIMEOUT_SECONDS: "20"
        run: python scripts/monitor/synthetic_search.py --detail-out "$RUNNER_TEMP/detail.txt"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          job_status: ${{ job.status }}
          job_name: verse-search
          state_branch: ${{ env.STATE_BRANCH }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          force_alert: ${{ github.event.inputs.force_alert }}

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - name: Check frontend is serving HTML
        id: check
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://voxquieta.org' }}
        run: |
          set -o pipefail
          # -L: follow redirects (apex domain may redirect to www.)
          body=$(curl -fsS -L --max-time 15 "$FRONTEND_URL")
          echo "$body" | grep -qi '<html\|<!DOCTYPE' || {
            echo "frontend response does not look like HTML: ${body:0:200}" > "$RUNNER_TEMP/detail.txt"
            exit 1
          }

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          job_status: ${{ job.status }}
          job_name: frontend
          state_branch: ${{ env.STATE_BRANCH }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          force_alert: ${{ github.event.inputs.force_alert }}

  # ---------------------------------------------------------------------------
  log-scan:
    name: Log scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Required so `uses: ./.github/actions/notify-telegram` can resolve the
      # local composite action — without checkout, the runner has no repo files.
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Resolve workspace ID
        id: ws
        run: |
          ws_id=$(az monitor log-analytics workspace show \
            --resource-group bible-app-rg \
            --workspace-name "$(az monitor log-analytics workspace list \
                --resource-group bible-app-rg \
                --query '[0].name' -o tsv)" \
            --query customerId -o tsv)
          [ -n "$ws_id" ] || { echo "::error::could not resolve workspace ID"; exit 2; }
          echo "id=$ws_id" >> "$GITHUB_OUTPUT"

      - name: Query for backend errors (last 10 min)
        id: query
        run: |
          set -o pipefail
          # BITB-056: single source of truth for the error definition, shared with the
          # Azure rule (deployment/monitoring.tf -> backend-error-filter.kql). This job
          # only appends its own aggregation tail. The shared filter selects ERROR-level
          # lines (the backend logs transient, self-recovered conditions at WARNING), so
          # this Telegram early-warning no longer fires on rate-limit / timeout / fallback
          # noise — the synthetic-chat, verse-search and health probes already cover the
          # user-facing symptoms of those. `sample` is a KQL operator, so the column is
          # `sample_log`; each sample is prefixed with its ErrorCategory.
          filter=$(cat deployment/azure-monitor/queries/backend-error-filter.kql)
          query="${filter}
            | summarize cnt = count(), sample_log = any(strcat('[', ErrorCategory, '] ', Log_s))
            | project cnt, sample_log"
          result=$(az monitor log-analytics query \
            --workspace "${{ steps.ws.outputs.id }}" \
            --analytics-query "$query" \
            -o json)
          echo "$result"
          cnt=$(echo "$result" | jq -r '.[0].cnt // 0')
          if [ "${cnt:-0}" != "0" ]; then
            sample=$(echo "$result" | jq -r '.[0].sample_log // ""' | head -c 1500)
            {
              echo "$cnt error log line(s) in the last 10m on bible-app-backend."
              echo ""
              echo "Sample:"
              echo "$sample"
            } > "$RUNNER_TEMP/detail.txt"
            exit 1
          fi

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/notify-telegram
        with:
          job_status: ${{ job.status }}
          job_name: log-scan
          state_branch: ${{ env.STATE_BRANCH }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          force_alert: ${{ github.event.inputs.force_alert }}
