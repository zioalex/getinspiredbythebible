name: Backfill release tags (one-time)

# Run manually once to create the missing v0.1.0–v0.7.0 tags.
# Delete this file after the tags have been created.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-tags:
    name: Create missing release tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Create missing tags
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          create_tag() {
            local tag="$1" sha="$2"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists — skipping"
            else
              git tag "$tag" "$sha"
              git push origin "$tag"
              echo "Created $tag → $sha"
            fi
          }

          create_tag v0.1.0 9e930ddad560119e445ffaaf2d127061b4576bff
          create_tag v0.2.0 963b90a83a5d691d7396fb299deb57de2ea5f7c2
          create_tag v0.3.0 1d32a5492c0628ff4115ffa8fec031ba309015bf
          create_tag v0.4.0 200464ea70010d130bde21543173f1221ce2803f
          create_tag v0.5.0 019df6e328b80dfaf3c497882f61f308b9ee98e2
          create_tag v0.6.0 048ef33fb37119b9397bba06f792bacb96ac4b4f
          create_tag v0.7.0 b8c31007afdf1357afe437afb7b0781bdf8e97b3
