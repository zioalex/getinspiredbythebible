# =============================================================================
# Terraform Infrastructure Pipeline
# =============================================================================
# This workflow manages Azure infrastructure using Terraform with remote state.
#
# Configuration is split between:
#   - deployment/terraform.tfvars          - Non-sensitive config (committed)
#   - deployment/terraform.tfvars.secrets  - Secrets (local, gitignored)
#   - GitHub Secrets                       - For CI/CD (secrets only)
#
# Required GitHub secrets:
#   ARM_CLIENT_ID        - Azure Service Principal Client ID
#   ARM_CLIENT_SECRET    - Azure Service Principal Client Secret
#   ARM_SUBSCRIPTION_ID  - Azure Subscription ID
#   ARM_TENANT_ID        - Azure Tenant ID
#   TF_STORAGE_ACCOUNT   - Storage account name for Terraform state
#
# Optional GitHub secrets (for deployment):
#   TF_VAR_DB_ADMIN_PASSWORD    - Database admin password
#   TF_VAR_OPENROUTER_API_KEY   - OpenRouter API key
#   TF_VAR_CLAUDE_API_KEY       - Claude API key (if using Claude)
#   CLOUDFLARE_ORIGIN_CERT_B64  - Base64-encoded Cloudflare Origin Certificate
#   TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD - Certificate password (if any)
#
# Workflow:
#   - On PR: Plan only (shows what would change)
#   - On main push: Plan + Apply (with approval)
#   - Manual trigger: Plan + optional Apply
# =============================================================================

name: Terraform Infrastructure

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

# Permissions needed for PR comments and artifact uploads
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  TF_VERSION: '1.6.0'
  TF_WORKING_DIR: './deployment'
  # Azure authentication via service principal
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # Validate Required Secrets
  # ---------------------------------------------------------------------------
  check-secrets:
    name: Check Required Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are set
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          TF_STORAGE_ACCOUNT: ${{ secrets.TF_STORAGE_ACCOUNT }}
        run: |
          missing=""
          [ -z "$ARM_CLIENT_ID" ] && missing="$missing ARM_CLIENT_ID"
          [ -z "$ARM_CLIENT_SECRET" ] && missing="$missing ARM_CLIENT_SECRET"
          [ -z "$ARM_SUBSCRIPTION_ID" ] && missing="$missing ARM_SUBSCRIPTION_ID"
          [ -z "$ARM_TENANT_ID" ] && missing="$missing ARM_TENANT_ID"
          [ -z "$TF_STORAGE_ACCOUNT" ] && missing="$missing TF_STORAGE_ACCOUNT"

          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo ""
            echo "Please configure the following GitHub secrets:"
            echo "  Repository → Settings → Secrets and variables → Actions"
            echo ""
            echo "Required secrets:"
            echo "  ARM_CLIENT_ID        - Azure Service Principal Client ID"
            echo "  ARM_CLIENT_SECRET    - Azure Service Principal Client Secret"
            echo "  ARM_SUBSCRIPTION_ID  - Azure Subscription ID"
            echo "  ARM_TENANT_ID        - Azure Tenant ID"
            echo "  TF_STORAGE_ACCOUNT   - Storage account name for Terraform state"
            echo ""
            echo "See deployment/README.md for setup instructions."
            exit 1
          fi
          echo "✓ All required secrets are configured"

  # ---------------------------------------------------------------------------
  # Terraform Format Check
  # ---------------------------------------------------------------------------
  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Post Format Status
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::warning::Terraform files are not properly formatted. Run 'terraform fmt -recursive' locally."

  # ---------------------------------------------------------------------------
  # Terraform Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (validation only)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ---------------------------------------------------------------------------
  # Terraform Plan
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
    env:
      # Only secrets are passed via environment (non-secrets are in terraform.tfvars)
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets.TF_VAR_CLAUDE_API_KEY }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Cloudflare Origin Certificate
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        if: env.CERT_B64 != ''
        run: |
          echo "$CERT_B64" | base64 -d > ${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx
          echo "TF_VAR_cloudflare_origin_cert_frontend=${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan_output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: Post Plan Summary
        if: always()
        run: |
          echo "## Terraform Plan Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ env.TF_WORKING_DIR }}/plan_output.txt | tail -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = '${{ steps.plan.outputs.exitcode }}';
            let status = '✅ No changes';
            if (exitCode === '2') {
              status = '📝 Changes detected';
            } else if (exitCode === '1') {
              status = '❌ Plan failed';
            }

            const body = `## Terraform Plan Results

            **Status:** ${status}

            <details>
            <summary>Plan Details</summary>

            \`\`\`
            See workflow logs for full plan output
            \`\`\`

            </details>

            > To apply these changes, merge to main or trigger the workflow manually.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ---------------------------------------------------------------------------
  # Terraform Apply
  # ---------------------------------------------------------------------------
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: production  # Requires approval
    env:
      # Only secrets are passed via environment (non-secrets are in terraform.tfvars)
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets.TF_VAR_CLAUDE_API_KEY }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Cloudflare Origin Certificate
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        if: env.CERT_B64 != ''
        run: |
          echo "$CERT_B64" | base64 -d > ${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx
          echo "TF_VAR_cloudflare_origin_cert_frontend=${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Post Apply Summary
        run: |
          echo "## Terraform Apply Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure has been updated successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          cd ${{ env.TF_WORKING_DIR }}
          terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Terraform Destroy (manual only)
  # ---------------------------------------------------------------------------
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment: production  # Requires approval
    env:
      # Only secrets are passed via environment (non-secrets are in terraform.tfvars)
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets.TF_VAR_CLAUDE_API_KEY }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Cloudflare Origin Certificate
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        if: env.CERT_B64 != ''
        run: |
          echo "$CERT_B64" | base64 -d > ${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx
          echo "TF_VAR_cloudflare_origin_cert_frontend=${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Post Destroy Summary
        run: |
          echo "## ⚠️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Azure resources have been destroyed." >> $GITHUB_STEP_SUMMARY
