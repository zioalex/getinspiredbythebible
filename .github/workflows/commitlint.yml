name: Commitlint

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install commitlint
        run: npm install --no-save --no-audit --no-fund @commitlint/cli @commitlint/config-conventional

      - name: Lint commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLANNING_AUTHOR_EMAIL: 198982749+Copilot@users.noreply.github.com
        run: |
          status=0
          while IFS= read -r sha; do
            message="$(git log -1 --format=%B "$sha")"
            author_email="$(git log -1 --format=%ae "$sha")"
            committer_email="$(git log -1 --format=%ce "$sha")"
            if [[ "$message" =~ ^[Ii]nitial[[:space:]]plan ]] && \
              [ "$author_email" = "$PLANNING_AUTHOR_EMAIL" ]; then
              echo "Skipping agent planning commit $sha"
              continue
            fi
            # Skip web-UI edits to markdown-only files by human (non-bot) authors.
            # In a squash-merge flow these informal edits (e.g. checking off
            # boxes in a compliance doc) never reach main — only the PR title,
            # linted separately by the commitlint-pr-title job, lands on main.
            if [ "$committer_email" = "noreply@github.com" ] && \
               [ "$author_email" != "$PLANNING_AUTHOR_EMAIL" ]; then
              all_docs=true
              found_any=false
              while IFS= read -r f; do
                found_any=true
                [[ "$f" == *.md ]] || { all_docs=false; break; }
              done < <(git diff-tree --no-commit-id -r --name-only "$sha")
              if $all_docs && $found_any; then
                echo "Skipping web UI markdown-only commit $sha (author: $author_email)"
                continue
              fi
            fi
            if ! printf '%s\n' "$message" | npx --no-install commitlint --config commitlint.config.cjs; then
              echo "Commit $sha failed commitlint"
              status=1
            fi
          done < <(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          exit $status

  commitlint-pr-title:
    # PR titles become the commit subject on squash-merge — which is what
    # release-please scans on main. If the title isn't a conventional commit
    # the merge ends up unclassified and silently absent from the next
    # release's changelog (cf. #565 → v1.6.2). This job lints the title with
    # the same commitlint.config.cjs the commit job uses, so type-enum and
    # other rules stay in one place.
    name: Lint PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install commitlint
        run: npm install --no-save --no-audit --no-fund @commitlint/cli @commitlint/config-conventional

      - name: Lint PR title against commitlint.config.cjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "${PR_TITLE}" | npx --no-install commitlint --config commitlint.config.cjs
