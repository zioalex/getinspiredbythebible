# =============================================================================
# GitHub Actions CI/CD Pipeline for Azure Container Apps
# =============================================================================
# This workflow builds, plans, and deploys the Bible Chat Application to Azure
# using Terraform. It consolidates build/deploy and infrastructure management
# into a single workflow.
#
# Triggers:
#   - workflow_run: After tests pass on main (build + plan + deploy)
#   - pull_request: Build validation + Terraform plan (no deploy)
#   - workflow_dispatch: Manual deploy, plan-only, or destroy
#
# Required secrets:
#   ARM_CLIENT_ID          - Azure Service Principal Client ID
#   ARM_CLIENT_SECRET      - Azure Service Principal Client Secret
#   ARM_SUBSCRIPTION_ID    - Azure Subscription ID
#   ARM_TENANT_ID          - Azure Tenant ID
#   TF_STORAGE_ACCOUNT     - Storage account name for Terraform state
#
# Optional secrets (for deployment):
#   TF_VAR_DB_ADMIN_PASSWORD    - Database admin password
#   TF_VAR_OPENROUTER_API_KEY   - OpenRouter API key
#   TF_VAR_CLAUDE_API_KEY       - Claude API key
#   TF_VAR_SMTP2GO_API_KEY      - SMTP2GO API key
#   TF_VAR_TURNSTILE_SECRET_KEY - Cloudflare Turnstile server-side secret
#   CLOUDFLARE_ORIGIN_CERT_B64  - Base64-encoded Cloudflare Origin Certificate
#   TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD - Certificate password
#
# For database seeding (optional):
#   TF_VAR_DB_ADMIN_USERNAME - e.g., bibleadmin
#   TF_VAR_DB_NAME           - e.g., bibleapp
#   AZURE_OPENAI_ENDPOINT    - e.g., https://your-resource.openai.azure.com/
#   AZURE_OPENAI_API_KEY     - Azure OpenAI API key
# =============================================================================

name: Build and Deploy to Azure

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Deploy PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || github.event_name == 'workflow_dispatch'
      && format('Manual {0} ({1})', inputs.action, github.ref_name)
      || format('Deploy main ({0})', github.sha) }}

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows: ["CI/CD - Test Application"]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "scripts/**"
      - "deployment/**"
      - ".github/workflows/azure-deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - plan
          - destroy
      deploy_component:
        description: "Component to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - backend
          - frontend
      skip_build:
        description: "Skip build and deploy existing images"
        required: false
        default: false
        type: boolean
      image_tag:
        description: "Image tag to deploy (commit SHA). Leave empty for current commit."
        required: false
        type: string
      skip_database_seed:
        description: "Skip database seeding"
        required: false
        default: true
        type: boolean
      force_database_seed:
        description: "Force reload Bible data even if already loaded"
        required: false
        default: false
        type: boolean
      bible_translation:
        description: "Specific translation to load (e.g., 'kjv', 'ita1927'). Leave empty for all."
        required: false
        type: string
      skip_embeddings:
        description: "Skip embedding generation (requires Azure OpenAI)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # Normalize commit SHA: workflow_run events use the triggering commit,
  # not the latest default-branch commit
  DEPLOY_SHA: >-
    ${{ github.event_name == 'workflow_run'
        && github.event.workflow_run.head_sha
        || github.sha }}
  TF_VERSION: "1.10.5"
  TF_WORKING_DIR: "./deployment"
  # TODO: update Azure resource names when infrastructure is renamed to voxquieta
  BACKEND_APP_NAME: bible-app-backend
  FRONTEND_APP_NAME: bible-app-frontend
  ACR_NAME: bibleappacrmb0172
  RESOURCE_GROUP: bible-app-rg
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # Detect Changes
  # ---------------------------------------------------------------------------
  changes:
    # Skip entirely when the test workflow failed (gates deploy on test success)
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
      migration_scripts: ${{ steps.filter.outputs.migration_scripts }}
      bible_scripts: ${{ steps.filter.outputs.bible_scripts }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            backend:
              - 'api/**'
            frontend:
              - 'frontend/**'
            scripts:
              - 'scripts/**'
            migration_scripts:
              - 'scripts/migrations/**'
            bible_scripts:
              - 'scripts/load_bible.py'
              - 'scripts/create_embeddings.py'
              - 'scripts/create_azure_embeddings.py'
              - 'scripts/translations.py'
              - 'scripts/init.sql'
            deployment:
              - 'deployment/**'

  # ---------------------------------------------------------------------------
  # Build and Push Backend
  # ---------------------------------------------------------------------------
  build-backend:
    needs: changes
    # Skip for Dependabot PRs (no access to secrets) and apply normal build logic
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.action == 'deploy' &&
         inputs.skip_build != true &&
         (inputs.deploy_component == 'both' || inputs.deploy_component == 'backend'))
      )
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/bible-backend
          tags: |
            type=raw,value=${{ env.DEPLOY_SHA }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build and Push Frontend
  # ---------------------------------------------------------------------------
  build-frontend:
    needs: changes
    # Skip for Dependabot PRs (no access to secrets) and apply normal build logic
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.action == 'deploy' &&
         inputs.skip_build != true &&
         (inputs.deploy_component == 'both' || inputs.deploy_component == 'frontend'))
      )
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/bible-frontend
          tags: |
            type=raw,value=${{ env.DEPLOY_SHA }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Get Backend URL
        id: backend-url
        run: |
          # Production builds bake the public custom domain into the frontend
          # image (so browsers go through Cloudflare, not the raw Azure FQDN).
          # PR builds use the raw Azure FQDN since the custom domain may not
          # resolve to PR preview environments.
          # Sanity-check the backend by calling the raw FQDN regardless, so a
          # backend outage still fails the build before we bake a URL in.
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          if [ -z "$BACKEND_FQDN" ]; then
            echo "::error::Failed to get backend URL from Azure Container Apps"
            echo "::error::Check RESOURCE_GROUP and BACKEND_APP_NAME are correct"
            exit 1
          fi

          RAW_BACKEND_URL="https://$BACKEND_FQDN"

          echo "Validating backend health via raw FQDN..."
          HEALTH_RESPONSE=$(curl -sf --max-time 30 "$RAW_BACKEND_URL/health/live" 2>/dev/null || echo "")
          if [ -z "$HEALTH_RESPONSE" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "::warning::Backend URL health check failed on PR (backend may be scaled to zero)."
              echo "::warning::Proceeding with build-only validation."
            else
              echo "::error::Backend URL does not respond to /health/live"
              echo "::error::URL: $RAW_BACKEND_URL"
              exit 1
            fi
          fi

          if [ -n "$HEALTH_RESPONSE" ] && echo "$HEALTH_RESPONSE" | grep -q '"status"'; then
            echo "✅ Backend health check passed"
          elif [ -n "$HEALTH_RESPONSE" ]; then
            echo "::error::Backend URL returned unexpected response (possibly frontend?)"
            echo "::error::Response: $HEALTH_RESPONSE"
            exit 1
          else
            echo "⚠️ Skipping response validation (no health response received)"
          fi

          # Choose what to bake into NEXT_PUBLIC_API_URL.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BACKEND_URL="$RAW_BACKEND_URL"
            echo "PR build → using raw FQDN"
          else
            CUSTOM_DOMAIN_BACKEND=$(
              grep -E '^[[:space:]]*custom_domain_backend[[:space:]]*=' deployment/terraform.tfvars |
              sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/'
            )
            if [ -z "$CUSTOM_DOMAIN_BACKEND" ]; then
              echo "::error::custom_domain_backend not set in deployment/terraform.tfvars"
              exit 1
            fi
            BACKEND_URL="https://$CUSTOM_DOMAIN_BACKEND"
          fi

          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "✅ Building frontend with NEXT_PUBLIC_API_URL=$BACKEND_URL"

      - name: Stage CHANGELOG.md into frontend/ for docker build context
        # The frontend Dockerfile uses `context: ./frontend`, so the repo-root
        # CHANGELOG.md is otherwise invisible to `next build` inside the
        # container. The prebuild script (extract-latest-changelog.mjs) looks
        # in ./CHANGELOG.md as a fallback when the repo-root copy is missing,
        # so this step makes the file reachable. Without it, the /changelog
        # page renders the empty state in production.
        run: |
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md frontend/CHANGELOG.md
            echo "Staged $(wc -l < CHANGELOG.md) lines from CHANGELOG.md into frontend/"
          else
            echo "::notice::No CHANGELOG.md at repo root — /changelog will render the empty state"
          fi

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TF_VAR_TURNSTILE_SITE_KEY }}

      - name: Verify API URL in image
        if: github.event_name != 'pull_request'
        run: |
          echo "Verifying NEXT_PUBLIC_API_URL is correctly baked into the image..."
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-frontend:${{ env.DEPLOY_SHA }}"
          EXPECTED_URL="${{ steps.backend-url.outputs.url }}"

          docker pull "$IMAGE"

          # Primary check: verify the CORRECT URL is present in the compiled JS
          # This is more reliable than checking for absence of localhost
          echo "Checking for expected API URL: $EXPECTED_URL"
          if docker run --rm "$IMAGE" sh -c "grep -r '$EXPECTED_URL' .next/ 2>/dev/null | head -3"; then
            echo "✅ Correct API URL found in image: $EXPECTED_URL"
          else
            echo "::error::ERROR: Expected API URL not found in image. Build arg may not have been applied."
            echo "::error::Expected: $EXPECTED_URL"
            # Show what URLs are in the image for debugging
            echo "URLs found in .next/ directory:"
            docker run --rm "$IMAGE" sh -c \
              "grep -roh 'http[s]*://[^\"'\'']*' .next/ 2>/dev/null | sort -u | head -20" || true
            exit 1
          fi

          # Secondary check: warn if localhost:8000 is found in main JS files (not source maps)
          # This is a warning, not a failure, since dead code paths may contain the fallback
          if docker run --rm "$IMAGE" sh -c \
            "grep -r 'localhost:8000' .next/server/ .next/static/ 2>/dev/null --include='*.js' | grep -v '.map'" \
            | head -1; then
            echo "::warning::localhost:8000 found in compiled JS. This may be dead code or fallback string."
          else
            echo "✅ No localhost:8000 found in compiled JavaScript"
          fi

  # ---------------------------------------------------------------------------
  # Terraform Validate (PRs only, when deployment/ changes)
  # ---------------------------------------------------------------------------
  tf-validate:
    needs: changes
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Post Format Warning
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::warning::Terraform files are not properly formatted. Run 'terraform fmt -recursive' locally."

      - name: Terraform Init (validation only)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ---------------------------------------------------------------------------
  # Terraform Plan
  # ---------------------------------------------------------------------------
  # Runs after builds on PRs, workflow_run (main), and manual plan/deploy.
  # On PRs: posts plan as PR comment.
  # On main / workflow_dispatch: uploads plan artifact for the deploy job.
  # Skipped only for workflow_dispatch action=destroy.
  tf-plan:
    needs: [changes, build-backend, build-frontend]
    if: >-
      always() && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.changes.result == 'success' && needs.build-backend.result != 'failure' && needs.build-frontend.result !=
      'failure' && (github.event_name != 'workflow_dispatch' ||
        inputs.action != 'destroy')
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.exit_code == '2' }}
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}
    env:
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets['TF_VAR_CLAUDE_API_KEY'] }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}
      TF_VAR_smtp2go_api_key: ${{ secrets.TF_VAR_SMTP2GO_API_KEY }}
      TF_VAR_turnstile_site_key: ${{ vars['TF_VAR_TURNSTILE_SITE_KEY'] }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TF_VAR_TURNSTILE_SECRET_KEY }}
      TF_VAR_monitor_probe_secret: ${{ secrets.MONITOR_PROBE_SECRET }}
      TF_VAR_smoke_probe_secret: ${{ secrets.SMOKE_PROBE_SECRET }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      # BITB-056: Azure Monitor -> Telegram bridge. Only the chat id is a TF var; the
      # bot token is written to Key Vault out-of-band (see the deploy job's
      # "Populate Telegram bot token in Key Vault" step), so it never enters terraform
      # state. Leave the chat id unset to keep Azure alert delivery email-only.
      TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Default to empty JSON array when the secret is unset; an empty TF_VAR_
      # for a list(string) variable would crash terraform parsing otherwise.
      TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS || '[]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Determine Image Tags
        id: image-tags
        run: |
          # Get currently deployed images
          CURRENT_BACKEND=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
          CURRENT_FRONTEND=$(az containerapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")

          echo "Currently deployed - Backend: $CURRENT_BACKEND"
          echo "Currently deployed - Frontend: $CURRENT_FRONTEND"

          IMAGE_TAG="${{ env.DEPLOY_SHA }}"
          BACKEND_BUILT="${{ needs.build-backend.result == 'success' }}"
          FRONTEND_BUILT="${{ needs.build-frontend.result == 'success' }}"

          # Backend image: use new if built, otherwise current
          if [ "$BACKEND_BUILT" == "true" ]; then
            BACKEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-backend:$IMAGE_TAG"
            echo "Using new backend image: $IMAGE_TAG"
          elif [ -n "$CURRENT_BACKEND" ]; then
            BACKEND_IMAGE="$CURRENT_BACKEND"
            echo "Using current backend (not built in this run)"
          else
            BACKEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-backend:latest"
            echo "Using fallback backend: latest"
          fi

          # Frontend image: use new if built, otherwise current
          if [ "$FRONTEND_BUILT" == "true" ]; then
            FRONTEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-frontend:$IMAGE_TAG"
            echo "Using new frontend image: $IMAGE_TAG"
          elif [ -n "$CURRENT_FRONTEND" ]; then
            FRONTEND_IMAGE="$CURRENT_FRONTEND"
            echo "Using current frontend (not built in this run)"
          else
            FRONTEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-frontend:latest"
            echo "Using fallback frontend: latest"
          fi

          echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
          echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
          echo ""
          echo "Will plan with:"
          echo "  Backend:  $BACKEND_IMAGE"
          echo "  Frontend: $FRONTEND_IMAGE"

      - name: Decode Cloudflare Origin Certificate
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::warning::CLOUDFLARE_ORIGIN_CERT_B64 secret is not set — custom domain SSL will not be configured"
            echo "cert_decoded=false" >> $GITHUB_ENV
          else
            echo "$CERT_B64" | base64 -d > ${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx
            # Normalize PFX: convert legacy PKCS12 (RC2/3DES from OpenSSL 1.x) to modern AES
            # format so newer Azure CLI (via azure/login@v3) can deserialize it
            PFX_FILE="${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx"
            CERT_PASS="${TF_VAR_cloudflare_origin_cert_password:-}"
            if openssl pkcs12 -legacy -in "$PFX_FILE" -passin "pass:${CERT_PASS}" \
                -nodes -out /tmp/pfx_chain.pem 2>/dev/null \
                || openssl pkcs12 -in "$PFX_FILE" -passin "pass:${CERT_PASS}" \
                -nodes -out /tmp/pfx_chain.pem 2>/dev/null; then
              if openssl pkcs12 -export -in /tmp/pfx_chain.pem \
                  -passout "pass:${CERT_PASS}" -out /tmp/pfx_modern.pfx 2>/dev/null; then
                mv /tmp/pfx_modern.pfx "$PFX_FILE"
                echo "PFX normalized to modern PKCS12 format"
              fi
              rm -f /tmp/pfx_chain.pem
            fi
            if openssl pkcs12 -in "$PFX_FILE" -passin "pass:${CERT_PASS}" -noout 2>/dev/null || \
               openssl pkcs12 -legacy -in "$PFX_FILE" -passin "pass:${CERT_PASS}" -noout 2>/dev/null; then
              # Path relative to TF working dir so filemd5() and az CLI resolve correctly
              echo "TF_VAR_cloudflare_origin_cert_frontend=cloudflare-origin.pfx" >> $GITHUB_ENV
              # Deterministic hash from the base64 secret — see deployment/main.tf
              # null_resource cert_hash triggers. filemd5 of the decoded PFX is
              # non-deterministic because the openssl pkcs12 -export step above
              # uses random salt/IV, so plan and apply hashes disagree.
              CERT_HASH=$(printf '%s' "$CERT_B64" | md5sum | awk '{print $1}')
              echo "TF_VAR_cloudflare_origin_cert_hash=$CERT_HASH" >> $GITHUB_ENV
              echo "cert_decoded=true" >> $GITHUB_ENV
            else
              # Plan-only: warn but don't block PRs on a broken cert secret.
              # The deploy/destroy jobs hard-fail on this same condition.
              echo "::warning::cloudflare-origin.pfx cannot be read — cert resources skipped in plan"
              echo "::warning::Fix: re-export PFX with openssl pkcs12 -export and refresh CLOUDFLARE_ORIGIN_CERT_B64"
              echo "cert_decoded=false" >> $GITHUB_ENV
            fi
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Disable the wrapper so terraform's real exit code is not masked.
          # The wrapper uses its own internal pipe which captures tee's exit code (0)
          # instead of terraform's -detailed-exitcode value (2 = changes present).
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          # Exit codes: 0=no changes (skip apply), 1=error (fail), 2=changes (run apply)
          # terraform_wrapper is disabled above so $PIPESTATUS[0] captures the real
          # terraform exit code (not the wrapper's, which always exits 0 via its own pipe).
          terraform plan \
            -var-file="terraform.tfvars" \
            -var="backend_image=${{ steps.image-tags.outputs.backend_image }}" \
            -var="frontend_image=${{ steps.image-tags.outputs.frontend_image }}" \
            -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan_output.txt
          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          # Exit 1 only on real terraform error (exit code 1).
          # Exit code 0 = no changes and exit code 2 = changes present are both
          # non-error outcomes; propagating code 2 causes a spurious GitHub
          # Actions error annotation even when the job succeeds.
          if [ "$PLAN_EXIT_CODE" == "1" ]; then
            exit 1
          fi
          exit 0
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Plan Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            let status = '✅ No changes';
            if (exitCode === '2') {
              status = '📝 Changes detected';
            } else if (exitCode === '1') {
              status = '❌ Plan failed';
            }

            const backendImage = '${{ steps.image-tags.outputs.backend_image }}';
            const frontendImage = '${{ steps.image-tags.outputs.frontend_image }}';

            const body = `## Terraform Plan Results

            **Status:** ${status}

            **Images:**
            - Backend: \`${backendImage}\`
            - Frontend: \`${frontendImage}\`

            <details>
            <summary>Plan Details</summary>

            \`\`\`
            See workflow logs for full plan output
            \`\`\`

            </details>

            > To apply these changes, merge to main or trigger the workflow manually.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Post Plan Summary
        if: always()
        run: |
          echo "## Terraform Plan Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ steps.image-tags.outputs.backend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ steps.image-tags.outputs.frontend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ env.TF_WORKING_DIR }}/plan_output.txt" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 "${{ env.TF_WORKING_DIR }}/plan_output.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Plan Result Summary
        if: always()
        run: |
          # Summarize plan result: 0=no changes (skip apply), 1=error (fail), 2=changes (run apply)
          EXIT_CODE="${{ steps.plan.outputs.exit_code }}"
          if [ "$EXIT_CODE" == "0" ]; then
            echo "## ℹ️ No Infrastructure Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Terraform plan completed with no changes. Deploy job will be skipped." >> $GITHUB_STEP_SUMMARY
          elif [ "$EXIT_CODE" == "2" ]; then
            echo "## 📝 Infrastructure Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Terraform plan detected changes. Deploy job will execute." >> $GITHUB_STEP_SUMMARY
          elif [ "$EXIT_CODE" == "1" ]; then
            echo "## ❌ Terraform Plan Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See plan output for error details." >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Deploy via Terraform
  # ---------------------------------------------------------------------------
  # On workflow_run (main after tests): applies the plan artifact from tf-plan.
  # On workflow_dispatch (action=deploy): applies the plan artifact from tf-plan.
  deploy:
    needs: [changes, build-backend, build-frontend, tf-plan]
    if: >-
      always() && github.event_name != 'pull_request' && needs.tf-plan.result == 'success' &&
      needs.tf-plan.outputs.has_changes == 'true' && (github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend_url: ${{ steps.verify.outputs.backend_url }}
    env:
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets['TF_VAR_CLAUDE_API_KEY'] }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}
      TF_VAR_smtp2go_api_key: ${{ secrets.TF_VAR_SMTP2GO_API_KEY }}
      TF_VAR_turnstile_site_key: ${{ vars['TF_VAR_TURNSTILE_SITE_KEY'] }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TF_VAR_TURNSTILE_SECRET_KEY }}
      TF_VAR_monitor_probe_secret: ${{ secrets.MONITOR_PROBE_SECRET }}
      TF_VAR_smoke_probe_secret: ${{ secrets.SMOKE_PROBE_SECRET }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      # BITB-056: Azure Monitor -> Telegram bridge. Only the chat id is a TF var; the
      # bot token is written to Key Vault out-of-band (see the deploy job's
      # "Populate Telegram bot token in Key Vault" step), so it never enters terraform
      # state. Leave the chat id unset to keep Azure alert delivery email-only.
      TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Default to empty JSON array when the secret is unset; an empty TF_VAR_
      # for a list(string) variable would crash terraform parsing otherwise.
      TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS || '[]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Guard — prod alerting must be configured (BITB-055)
        run: |
          # TF_VAR_alert_email drives Azure Monitor alerts. Without it, alerts_enabled
          # evaluates to false and all monitoring silently stops. Catch this before deploy.
          if [ -z "$TF_VAR_alert_email" ]; then
            msg="TF_VAR_ALERT_EMAIL secret is not set — Azure Monitor alert email will be"
            msg="$msg empty and all prod alerts will be silently disabled"
            msg="$msg (alerts_enabled = false). Set the secret in repo settings."
            echo "::error::$msg"
            exit 1
          fi
          echo "Guard passed: TF_VAR_alert_email is configured"
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Determine Image Tags
        id: image-tags
        run: |
          # Get currently deployed images
          CURRENT_BACKEND=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
          CURRENT_FRONTEND=$(az containerapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")

          echo "Currently deployed - Backend: $CURRENT_BACKEND"
          echo "Currently deployed - Frontend: $CURRENT_FRONTEND"

          # Determine image tag to use
          SKIP_BUILD="${{ inputs.skip_build }}"
          PROVIDED_TAG="${{ inputs.image_tag }}"

          if [ "$SKIP_BUILD" == "true" ] && [ -z "$PROVIDED_TAG" ]; then
            # skip_build without image_tag: use currently deployed images
            echo "Mode: skip_build without image_tag - using currently deployed images"
            BACKEND_IMAGE="$CURRENT_BACKEND"
            FRONTEND_IMAGE="$CURRENT_FRONTEND"

            if [ -z "$BACKEND_IMAGE" ] || [ -z "$FRONTEND_IMAGE" ]; then
              echo "::error::Cannot skip build without deployed images. Deploy at least once first."
              exit 1
            fi
          elif [ "$SKIP_BUILD" == "true" ] && [ -n "$PROVIDED_TAG" ]; then
            # skip_build with image_tag: verify and use specified tag
            echo "Mode: skip_build with image_tag - verifying tag: $PROVIDED_TAG"
            DEPLOY_COMPONENT="${{ inputs.deploy_component }}"

            if [ "$DEPLOY_COMPONENT" == "both" ] || [ "$DEPLOY_COMPONENT" == "backend" ]; then
              if ! az acr repository show-tags -n ${{ env.ACR_NAME }} --repository bible-backend \
                   --query "[?@=='$PROVIDED_TAG']" -o tsv | grep -q .; then
                echo "::error::Backend image with tag '$PROVIDED_TAG' not found in ACR"
                exit 1
              fi
              echo "✅ Backend image found: $PROVIDED_TAG"
              BACKEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-backend:$PROVIDED_TAG"
            else
              BACKEND_IMAGE="$CURRENT_BACKEND"
            fi

            if [ "$DEPLOY_COMPONENT" == "both" ] || [ "$DEPLOY_COMPONENT" == "frontend" ]; then
              if ! az acr repository show-tags -n ${{ env.ACR_NAME }} --repository bible-frontend \
                   --query "[?@=='$PROVIDED_TAG']" -o tsv | grep -q .; then
                echo "::error::Frontend image with tag '$PROVIDED_TAG' not found in ACR"
                exit 1
              fi
              echo "✅ Frontend image found: $PROVIDED_TAG"
              FRONTEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-frontend:$PROVIDED_TAG"
            else
              FRONTEND_IMAGE="$CURRENT_FRONTEND"
            fi
          else
            # Normal build: use new images for built components, current for others
            echo "Mode: normal build"
            IMAGE_TAG="${{ env.DEPLOY_SHA }}"
            BACKEND_BUILT="${{ needs.build-backend.result == 'success' }}"
            FRONTEND_BUILT="${{ needs.build-frontend.result == 'success' }}"
            DEPLOY_COMPONENT="${{ inputs.deploy_component }}"

            echo "Build results - Backend: $BACKEND_BUILT, Frontend: $FRONTEND_BUILT"

            # Backend image selection
            if [ "$DEPLOY_COMPONENT" == "frontend" ] && [ -n "$CURRENT_BACKEND" ]; then
              BACKEND_IMAGE="$CURRENT_BACKEND"
              echo "Using current backend (frontend-only deploy)"
            elif [ "$BACKEND_BUILT" == "true" ]; then
              BACKEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-backend:$IMAGE_TAG"
              echo "Using new backend image: $IMAGE_TAG"
            elif [ -n "$CURRENT_BACKEND" ]; then
              BACKEND_IMAGE="$CURRENT_BACKEND"
              echo "Using current backend (not built in this run)"
            else
              echo "::error::No backend image available"
              exit 1
            fi

            # Frontend image selection
            if [ "$DEPLOY_COMPONENT" == "backend" ] && [ -n "$CURRENT_FRONTEND" ]; then
              FRONTEND_IMAGE="$CURRENT_FRONTEND"
              echo "Using current frontend (backend-only deploy)"
            elif [ "$FRONTEND_BUILT" == "true" ]; then
              FRONTEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-frontend:$IMAGE_TAG"
              echo "Using new frontend image: $IMAGE_TAG"
            elif [ -n "$CURRENT_FRONTEND" ]; then
              FRONTEND_IMAGE="$CURRENT_FRONTEND"
              echo "Using current frontend (not built in this run)"
            else
              echo "::error::No frontend image available"
              exit 1
            fi
          fi

          echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
          echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
          echo ""
          echo "Will deploy:"
          echo "  Backend:  $BACKEND_IMAGE"
          echo "  Frontend: $FRONTEND_IMAGE"

      - name: Decode Cloudflare Origin Certificate
        id: decode-cert
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::warning::CLOUDFLARE_ORIGIN_CERT_B64 secret is not set — custom domain SSL will not be configured"
            echo "cert_decoded=false" >> $GITHUB_ENV
            echo "cert_decoded=false" >> $GITHUB_OUTPUT
          else
            echo "$CERT_B64" | base64 -d > deployment/cloudflare-origin.pfx
            # Normalize PFX: convert legacy PKCS12 (RC2/3DES from OpenSSL 1.x) to modern AES
            # format so newer Azure CLI (via azure/login@v3) can deserialize it.
            # Note: openssl pkcs12 -export uses random salt/IV, so the resulting
            # PFX bytes differ between runners. cert_hash trigger is computed
            # from $CERT_B64 below, not from the file, to keep it deterministic.
            PFX_FILE="deployment/cloudflare-origin.pfx"
            CERT_PASS="${TF_VAR_cloudflare_origin_cert_password:-}"
            if openssl pkcs12 -legacy -in "$PFX_FILE" -passin "pass:${CERT_PASS}" \
                -nodes -out /tmp/pfx_chain.pem 2>/dev/null \
                || openssl pkcs12 -in "$PFX_FILE" -passin "pass:${CERT_PASS}" \
                -nodes -out /tmp/pfx_chain.pem 2>/dev/null; then
              if openssl pkcs12 -export -in /tmp/pfx_chain.pem \
                  -passout "pass:${CERT_PASS}" -out /tmp/pfx_modern.pfx 2>/dev/null; then
                mv /tmp/pfx_modern.pfx "$PFX_FILE"
                echo "PFX normalized to modern PKCS12 format"
              fi
              rm -f /tmp/pfx_chain.pem
            fi
            if openssl pkcs12 -in "$PFX_FILE" -passin "pass:${CERT_PASS}" -noout 2>/dev/null || \
               openssl pkcs12 -legacy -in "$PFX_FILE" -passin "pass:${CERT_PASS}" -noout 2>/dev/null; then
              # Path relative to TF working dir so filemd5() and az CLI resolve correctly
              echo "TF_VAR_cloudflare_origin_cert_frontend=cloudflare-origin.pfx" >> $GITHUB_ENV
              CERT_HASH=$(printf '%s' "$CERT_B64" | md5sum | awk '{print $1}')
              echo "TF_VAR_cloudflare_origin_cert_hash=$CERT_HASH" >> $GITHUB_ENV
              echo "cert_decoded=true" >> $GITHUB_ENV
              echo "cert_decoded=true" >> $GITHUB_OUTPUT
            else
              echo "::error::CLOUDFLARE_ORIGIN_CERT_B64 is set but the resulting PFX cannot be read."
              echo "::error::Re-export the Cloudflare Origin Cert as PFX, then refresh the GitHub Actions secret:"
              echo "::error::  openssl pkcs12 -export -out cloudflare-origin.pfx \\"
              echo "::error::    -inkey origin-key.pem -in origin-cert.pem \\"
              echo "::error::    -passout \"pass:\$TF_VAR_cloudflare_origin_cert_password\""
              echo "::error::  base64 -w0 cloudflare-origin.pfx | gh secret set CLOUDFLARE_ORIGIN_CERT_B64"
              echo "::error::See deployment/README.md > 'Rotating CLOUDFLARE_ORIGIN_CERT_B64' for the full procedure."
              exit 1
            fi
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: deployment
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: deployment

      - name: Terraform Apply
        working-directory: deployment
        run: terraform apply -auto-approve tfplan

      - name: Login to Azure (for verification)
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      # BITB-056: set the Telegram bot token into Key Vault out-of-band, so it never
      # enters terraform state. No-op unless the Telegram bridge is enabled (the
      # telegram_kv_name output is non-empty, i.e. TF_VAR_telegram_chat_id was set).
      - name: Populate Telegram bot token in Key Vault (BITB-056)
        working-directory: deployment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -o pipefail
          kv=$(terraform output -raw telegram_kv_name 2>/dev/null || echo "")
          if [ -z "$kv" ]; then
            echo "Telegram bridge disabled (no Key Vault) — skipping token upload."
            exit 0
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN empty; KV exists but Logic App can't post until it is set."
            exit 0
          fi
          # Retry: the deployer access policy can take a few seconds to propagate.
          for i in 1 2 3 4; do
            if az keyvault secret set \
                 --vault-name "$kv" \
                 --name telegram-bot-token \
                 --value "$TELEGRAM_BOT_TOKEN" \
                 --output none; then
              echo "Telegram bot token stored in Key Vault $kv."
              exit 0
            fi
            echo "secret set attempt $i failed (access policy may still be propagating); retrying..."
            sleep $((i * 5))
          done
          echo "::error::Failed to set telegram-bot-token in Key Vault $kv after retries."
          exit 1

      - name: Verify Deployment
        id: verify
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          # Check backend health and export URL for functional-tests job
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$BACKEND_FQDN" ]; then
            BACKEND_URL="https://$BACKEND_FQDN"
            echo "Backend URL: $BACKEND_URL"
            for i in 1 2 3; do
              if curl -sf "$BACKEND_URL/health/live" --max-time 10; then
                echo "Backend health check passed"
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "::error::Backend health check failed after 3 attempts"
                exit 1
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            # Export for functional-tests job
            echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          else
            echo "::warning::Could not determine backend URL — functional API tests will be skipped"
            echo "backend_url=" >> $GITHUB_OUTPUT
          fi

          # Get frontend URL (for logging)
          FRONTEND_FQDN=$(az containerapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$FRONTEND_FQDN" ]; then
            echo "Frontend URL: https://$FRONTEND_FQDN"
          fi

      - name: Verify Custom Domain HTTPS
        run: |
          set -euo pipefail
          DOMAINS=("voxquieta.org" "api.voxquieta.org")
          FAILED=0
          for DOMAIN in "${DOMAINS[@]}"; do
            echo "Checking https://$DOMAIN ..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 15 "https://$DOMAIN/health" 2>/dev/null || echo "000")
            CF_RAY=$(curl -sI --max-time 15 "https://$DOMAIN/health" 2>/dev/null | grep -i 'cf-ray' || echo "")

            case "$HTTP_CODE" in
              200)
                if [ -z "$CF_RAY" ]; then
                  echo "::error::$DOMAIN returned 200 but no cf-ray header — traffic is bypassing Cloudflare"
                  FAILED=1
                else
                  echo "$DOMAIN OK — HTTP 200, $CF_RAY"
                fi
                ;;
              525)
                echo "::error::$DOMAIN returned 525 (SSL Handshake Failed) — origin cert missing or not bound"
                FAILED=1
                ;;
              526)
                echo "::error::$DOMAIN returned HTTP 526 (Invalid SSL Certificate) — origin cert chain is wrong"
                FAILED=1
                ;;
              000)
                echo "::error::$DOMAIN is unreachable (HTTP 000) — DNS or Cloudflare misconfigured"
                FAILED=1
                ;;
              5*)
                echo "::error::$DOMAIN returned HTTP $HTTP_CODE — origin error"
                FAILED=1
                ;;
              *)
                if [ -z "$CF_RAY" ]; then
                  echo "::error::$DOMAIN responded HTTP $HTTP_CODE with no cf-ray header"
                  FAILED=1
                else
                  echo "$DOMAIN responded HTTP $HTTP_CODE (non-200 but reached Cloudflare), $CF_RAY"
                fi
                ;;
            esac
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more domains failed the post-deploy SSL/health check"
            exit 1
          fi

      - name: Post Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed via Terraform**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skip_build }}" == "true" ]; then
            echo "🔄 **Mode:** Deploy existing images (skip build)" >> $GITHUB_STEP_SUMMARY
          else
            echo "🏗️ **Mode:** Build and deploy" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ steps.image-tags.outputs.backend_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ steps.image-tags.outputs.frontend_image }}\` |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Functional Tests (post-deployment smoke tests)
  # ---------------------------------------------------------------------------
  # Two test suites run after a successful deploy:
  #
  #  1. E2E tests (tests/e2e/)  — hit the frontend URL like a real user's
  #     browser would. Checks that all locale pages load with HTML content.
  #     URL: set via vars.FRONTEND_URL  (stable Cloudflare URL)
  #
  #  2. Functional API tests (tests/functional/) — hit the backend API directly.
  #     URL: the Azure Container Apps FQDN passed from the deploy job output.
  #     Tests API endpoints (scripture verse/chapter/search, chat validation,
  #     multilanguage localization fixes, health/config).
  #
  # A failure in either suite marks the pipeline red so the team can
  # investigate and consider rolling back.
  functional-tests:
    name: Functional Tests (smoke)
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install httpx pytest pytest-asyncio pydantic pydantic-settings

      - name: Run e2e tests (real user — frontend URL)
        id: e2e
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://voxquieta.org' }}
          DATABASE_URL: postgresql://e2e:e2e@localhost/e2e # pragma: allowlist secret
        run: |
          cd api
          python -m pytest tests/e2e/ -m e2e -v --tb=short

      - name: Run functional API tests (backend API)
        id: functional
        env:
          BACKEND_API_URL: ${{ needs.deploy.outputs.backend_url }}
        run: |
          cd api
          python -m pytest tests/functional/ -m functional -v --tb=short

      - name: Post Test Summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Tests (real user via frontend)" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** ${{ vars['FRONTEND_URL'] || 'https://voxquieta.org' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.e2e.outcome }}" == "success" ]; then
            echo "✅ All e2e tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.e2e.outcome }}" == "skipped" ]; then
            echo "⏭️ E2E tests skipped (frontend unreachable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ E2E tests failed — frontend may be broken" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Functional API Tests (backend)" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${{ needs.deploy.outputs.backend_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.functional.outcome }}" == "success" ]; then
            echo "✅ All API functional tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.functional.outcome }}" == "skipped" ]; then
            echo "⏭️ API tests skipped (backend URL not available)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ API functional tests failed — check backend logs, consider rollback" >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # Terraform Destroy (manual only)
  # ---------------------------------------------------------------------------
  destroy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets['TF_VAR_CLAUDE_API_KEY'] }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}
      TF_VAR_smtp2go_api_key: ${{ secrets.TF_VAR_SMTP2GO_API_KEY }}
      TF_VAR_turnstile_site_key: ${{ vars['TF_VAR_TURNSTILE_SITE_KEY'] }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TF_VAR_TURNSTILE_SECRET_KEY }}
      TF_VAR_monitor_probe_secret: ${{ secrets.MONITOR_PROBE_SECRET }}
      TF_VAR_smoke_probe_secret: ${{ secrets.SMOKE_PROBE_SECRET }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      # BITB-056: Azure Monitor -> Telegram bridge. Only the chat id is a TF var; the
      # bot token is written to Key Vault out-of-band (see the deploy job's
      # "Populate Telegram bot token in Key Vault" step), so it never enters terraform
      # state. Leave the chat id unset to keep Azure alert delivery email-only.
      TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Default to empty JSON array when the secret is unset; an empty TF_VAR_
      # for a list(string) variable would crash terraform parsing otherwise.
      TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS || '[]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Cloudflare Origin Certificate
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::warning::CLOUDFLARE_ORIGIN_CERT_B64 secret is not set — custom domain SSL will not be configured"
            echo "cert_decoded=false" >> $GITHUB_ENV
          else
            echo "$CERT_B64" | base64 -d > ${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx
            # Normalize PFX: convert legacy PKCS12 (RC2/3DES from OpenSSL 1.x) to modern AES
            # format so newer Azure CLI (via azure/login@v3) can deserialize it
            PFX_FILE="${{ env.TF_WORKING_DIR }}/cloudflare-origin.pfx"
            CERT_PASS="${TF_VAR_cloudflare_origin_cert_password:-}"
            if openssl pkcs12 -legacy -in "$PFX_FILE" -passin "pass:${CERT_PASS}" \
                -nodes -out /tmp/pfx_chain.pem 2>/dev/null \
                || openssl pkcs12 -in "$PFX_FILE" -passin "pass:${CERT_PASS}" \
                -nodes -out /tmp/pfx_chain.pem 2>/dev/null; then
              if openssl pkcs12 -export -in /tmp/pfx_chain.pem \
                  -passout "pass:${CERT_PASS}" -out /tmp/pfx_modern.pfx 2>/dev/null; then
                mv /tmp/pfx_modern.pfx "$PFX_FILE"
                echo "PFX normalized to modern PKCS12 format"
              fi
              rm -f /tmp/pfx_chain.pem
            fi
            if openssl pkcs12 -in "$PFX_FILE" -passin "pass:${CERT_PASS}" -noout 2>/dev/null || \
               openssl pkcs12 -legacy -in "$PFX_FILE" -passin "pass:${CERT_PASS}" -noout 2>/dev/null; then
              # Path relative to TF working dir so filemd5() and az CLI resolve correctly
              echo "TF_VAR_cloudflare_origin_cert_frontend=cloudflare-origin.pfx" >> $GITHUB_ENV
              CERT_HASH=$(printf '%s' "$CERT_B64" | md5sum | awk '{print $1}')
              echo "TF_VAR_cloudflare_origin_cert_hash=$CERT_HASH" >> $GITHUB_ENV
              echo "cert_decoded=true" >> $GITHUB_ENV
            else
              echo "::error::CLOUDFLARE_ORIGIN_CERT_B64 is set but the resulting PFX cannot be read."
              echo "::error::Re-export the Cloudflare Origin Cert as PFX, then refresh the GitHub Actions secret:"
              echo "::error::  openssl pkcs12 -export -out cloudflare-origin.pfx \\"
              echo "::error::    -inkey origin-key.pem -in origin-cert.pem \\"
              echo "::error::    -passout \"pass:\$TF_VAR_cloudflare_origin_cert_password\""
              echo "::error::  base64 -w0 cloudflare-origin.pfx | gh secret set CLOUDFLARE_ORIGIN_CERT_B64"
              echo "::error::See deployment/README.md > 'Rotating CLOUDFLARE_ORIGIN_CERT_B64' for the full procedure."
              exit 1
            fi
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var-file="terraform.tfvars" \
            -var="backend_image=${{ env.ACR_NAME }}.azurecr.io/bible-backend:${{ github.sha }}" \
            -var="frontend_image=${{ env.ACR_NAME }}.azurecr.io/bible-frontend:${{ github.sha }}" \
            -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Post Destroy Summary
        run: |
          echo "## ⚠️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Azure resources have been destroyed." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Run Database Migrations (runs when migration scripts change or on deploy)
  # ---------------------------------------------------------------------------
  # Applies all numbered migration scripts in order after a successful deploy.
  # Safe to re-run: each script is idempotent (uses IF EXISTS / IF NOT EXISTS).
  #
  # IMPORTANT: This job must be able to run independently when migration scripts
  # change, even if deploy is skipped. The 'always()' function ensures this job
  # evaluates even when deploy is skipped, and we check deploy didn't fail.
  run-migrations:
    needs: [changes, deploy]
    # Run when:
    # - migration scripts changed (always apply on migration changes), OR
    # - manual deploy triggered
    # Only on main/workflow_run — not on PRs (no DB access from PR branches)
    # Conditions:
    # 1. always() - evaluate even if deploy was skipped
    # 2. Not a PR (no DB access from PR branches)
    # 3. Deploy didn't fail (success or skipped is OK)
    # 4. Migration scripts changed OR manual workflow_dispatch
    if: >-
      always() && github.event_name != 'pull_request' && (needs.deploy.result == 'success' || needs.deploy.result ==
      'skipped') && (needs.changes.outputs.migration_scripts == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install asyncpg pydantic pydantic-settings

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Get Database Connection String
        id: db
        run: |
          DB_HOST=$(az postgres flexible-server list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT

      - name: Run migrations
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
        run: |
          export DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?ssl=require"
          cd scripts/migrations
          python run_migrations.py

  # ---------------------------------------------------------------------------
  # Seed Matrix (derives the translation list from scripts/translations.py)
  # ---------------------------------------------------------------------------
  # The seed matrix used to be a hardcoded list of translation codes, which
  # silently drifted out of sync whenever a new translation was added to
  # scripts/translations.py (e.g. luther1912 in BITB-046 never
  # got seeded or embedded). Generating the matrix from the single source of
  # truth keeps them in lockstep — any translation added to TRANSLATIONS is
  # seeded automatically. translations.py is pure Python (no third-party
  # imports), so no dependency install is needed here.
  seed-matrix:
    needs: [changes, deploy]
    # Mirror the seed-database trigger conditions so the matrix is only built
    # when seeding will actually run.
    if: >-
      always() && github.event_name != 'pull_request' && (needs.deploy.result == 'success' || needs.deploy.result ==
      'skipped') && ((needs.changes.outputs.bible_scripts == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_database_seed == false))
    runs-on: ubuntu-latest
    outputs:
      translations: ${{ steps.gen.outputs.translations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate translation matrix
        id: gen
        run: |
          cd scripts
          MATRIX=$(python -c 'import json, translations as t; print(json.dumps(sorted(t.TRANSLATIONS)))')
          echo "translations=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Seed matrix: $MATRIX"

  # ---------------------------------------------------------------------------
  # Seed Database (runs when scripts change or manually triggered with seed enabled)
  # ---------------------------------------------------------------------------
  # Each translation is loaded in parallel using a matrix strategy.
  # This avoids the single-job 6-hour hang when getBible API is slow.
  #
  # Parallelism safety:
  #   - books/chapters tables: shared across translations, all writes use
  #     INSERT ... ON CONFLICT DO NOTHING — safe for concurrent execution.
  #   - verses table: partitioned by translation_id — no cross-job conflicts.
  #
  # When `bible_translation` input is provided, only that one matrix job runs
  # (others are filtered out by the per-job `if` condition).
  #
  # Timeout: 90 minutes per translation. With batch inserts (~66 executemany calls
  # per translation instead of ~31k individual round-trips), loading one translation
  # should complete in well under 15 minutes; 90 min gives ample headroom without
  # risking the 6-hour default GitHub Actions timeout on a stuck job.
  seed-database:
    needs: [changes, deploy, seed-matrix]
    # Run if:
    # - Seeding-relevant scripts changed (load_bible.py, create_embeddings.py, create_azure_embeddings.py), OR
    # - Manual trigger with skip_database_seed=false
    # Note: always() needed to evaluate when deploy is skipped, but only run if deploy didn't fail
    # Conditions:
    # 1. always() - evaluate even if deploy was skipped
    # 2. Not a PR (no DB access from PR branches)
    # 3. Deploy didn't fail (success or skipped is OK)
    # 4. Bible scripts changed OR manual workflow_dispatch with seeding enabled
    # Note: per-translation filtering (when bible_translation input is set) is handled
    # inside the "Load Bible Data" step via a shell early-exit, because matrix context
    # is not reliably available in job-level if conditions on workflow_run events.
    if: >-
      always() && github.event_name != 'pull_request' && needs.seed-matrix.result == 'success' && (needs.deploy.result
      == 'success' || needs.deploy.result == 'skipped') && ((needs.changes.outputs.bible_scripts == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_database_seed == false))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    strategy:
      fail-fast: false # one slow translation should not cancel the others
      matrix:
        # Derived from scripts/translations.py via the seed-matrix job so the
        # list can never drift out of sync with the translation registry.
        translation: ${{ fromJson(needs.seed-matrix.outputs.translations) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install dependencies
        run: |
          pip install httpx asyncpg sqlalchemy openai

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Get Database Connection String
        id: db
        run: |
          # Get PostgreSQL FQDN from Azure
          DB_HOST=$(az postgres flexible-server list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT

      - name: Translation Status (pre-load, ${{ matrix.translation }})
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
        run: |
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          cd scripts
          python load_bible.py --status

      - name: Load Bible Data (${{ matrix.translation }})
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
        run: |
          # When a specific translation is requested, skip all others
          REQUESTED="${{ inputs.bible_translation }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "${{ matrix.translation }}" ]; then
            echo "Skipping ${{ matrix.translation }} (requested: $REQUESTED)"
            exit 0
          fi

          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          cd scripts

          FORCE_FLAG=""
          if [ "${{ inputs.force_database_seed }}" == "true" ]; then
            FORCE_FLAG="--force"
            echo "Force mode enabled - will reload translation"
          fi

          echo "Loading translation: ${{ matrix.translation }}"
          python load_bible.py --translation ${{ matrix.translation }} $FORCE_FLAG

      - name: Post Seeding Summary (${{ matrix.translation }})
        if: always()
        run: |
          echo "## Database Seeding: ${{ matrix.translation }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bible data load completed for \`${{ matrix.translation }}\`." >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Post-Seed: Embeddings + Verification (runs after all seed-database jobs)
  # ---------------------------------------------------------------------------
  seed-database-post:
    needs: [changes, deploy, seed-database]
    # Mirror the seed-database trigger conditions
    if: >-
      always() && github.event_name != 'pull_request' && (needs.deploy.result == 'success' || needs.deploy.result ==
      'skipped') && needs.seed-database.result != 'skipped' && ((needs.changes.outputs.bible_scripts == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_database_seed == false))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install dependencies
        run: |
          pip install httpx asyncpg sqlalchemy openai psycopg2-binary

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Get Database Connection String
        id: db
        run: |
          DB_HOST=$(az postgres flexible-server list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT

      - name: Generate Embeddings
        if: inputs.skip_embeddings != true
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
        run: |
          # Check if Azure OpenAI is configured
          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
            echo "⏭️ Skipping embedding generation"
            echo "   Reason: AZURE_OPENAI_ENDPOINT secret not configured"
            exit 0
          fi

          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          cd scripts
          echo "Generating embeddings with Azure OpenAI..."
          python create_azure_embeddings.py

      - name: Skip Embeddings Notice
        if: inputs.skip_embeddings == true
        run: |
          echo "⏭️ Skipping embedding generation"
          echo "   Reason: skip_embeddings=true"

      - name: Translation Status (post-load)
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
        run: |
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          cd scripts
          python load_bible.py --status
          # Fail the job if no verses were loaded at all
          python -c "
          import asyncio, os, sys
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def check():
              url = os.environ['DATABASE_URL']
              url = url.replace('postgresql://', 'postgresql+asyncpg://')
              url = url.replace('sslmode=', 'ssl=')
              engine = create_async_engine(url)
              async with engine.begin() as conn:
                  count = (await conn.execute(text('SELECT COUNT(*) FROM verses'))).scalar()
              await engine.dispose()
              if count == 0:
                  print('ERROR: No verses loaded!', file=sys.stderr)
                  sys.exit(1)
              print(f'OK: {count:,} total verses in database')
          asyncio.run(check())
          "

      - name: Post Seeding Summary
        if: always()
        run: |
          echo "## Database Seeding Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All translations loaded in parallel. Embeddings and verification complete." >> $GITHUB_STEP_SUMMARY
