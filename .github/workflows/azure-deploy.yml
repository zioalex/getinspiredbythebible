# =============================================================================
# GitHub Actions CI/CD Pipeline for Azure Container Apps
# =============================================================================
# This workflow builds and deploys the Bible Chat Application to Azure
#
# Uses the same ARM_* secrets as the Terraform workflow for consistency.
#
# Required secrets (same as Terraform workflow):
#   ARM_CLIENT_ID          - Azure Service Principal Client ID
#   ARM_CLIENT_SECRET      - Azure Service Principal Client Secret
#   ARM_SUBSCRIPTION_ID    - Azure Subscription ID
#   ARM_TENANT_ID          - Azure Tenant ID
#
# For database seeding (optional, only if scripts/ changes):
#   TF_VAR_DB_ADMIN_USERNAME - e.g., bibleadmin
#   TF_VAR_DB_ADMIN_PASSWORD - Database password
#   TF_VAR_DB_NAME           - e.g., bibleapp
#   AZURE_OPENAI_ENDPOINT    - e.g., https://your-resource.openai.azure.com/
#   AZURE_OPENAI_API_KEY     - Azure OpenAI API key
# =============================================================================

name: Build and Deploy to Azure

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/azure-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "scripts/**"
  workflow_dispatch: # Allow manual triggers

env:
  BACKEND_APP_NAME: bible-app-backend
  FRONTEND_APP_NAME: bible-app-frontend
  ACR_NAME: bibleappacrmb0172
  RESOURCE_GROUP: bible-app-rg-mb0172

jobs:
  # ---------------------------------------------------------------------------
  # Detect Changes
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
            frontend:
              - 'frontend/**'
            scripts:
              - 'scripts/**'

  # ---------------------------------------------------------------------------
  # Build and Push Backend
  # ---------------------------------------------------------------------------
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/bible-backend
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build and Push Frontend
  # ---------------------------------------------------------------------------
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_NAME }}.azurecr.io/bible-frontend
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Get Backend URL
        id: backend-url
        run: |
          # Get the backend URL from Azure Container Apps
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$BACKEND_FQDN" ]; then
            BACKEND_URL="https://$BACKEND_FQDN"
          else
            # Fallback to custom domain if container app not found
            BACKEND_URL="https://getinspiredbythebible.ai4you.sh"
          fi

          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Building frontend with NEXT_PUBLIC_API_URL=$BACKEND_URL"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }}

      - name: Verify API URL in image
        if: github.event_name != 'pull_request'
        run: |
          echo "Verifying NEXT_PUBLIC_API_URL is correctly baked into the image..."
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/bible-frontend:${{ github.sha }}"
          EXPECTED_URL="${{ steps.backend-url.outputs.url }}"

          docker pull "$IMAGE"

          # Primary check: verify the CORRECT URL is present in the compiled JS
          # This is more reliable than checking for absence of localhost
          echo "Checking for expected API URL: $EXPECTED_URL"
          if docker run --rm "$IMAGE" sh -c "grep -r '$EXPECTED_URL' .next/ 2>/dev/null | head -3"; then
            echo "✅ Correct API URL found in image: $EXPECTED_URL"
          else
            echo "::error::ERROR: Expected API URL not found in image. Build arg may not have been applied."
            echo "::error::Expected: $EXPECTED_URL"
            # Show what URLs are in the image for debugging
            echo "URLs found in .next/ directory:"
            docker run --rm "$IMAGE" sh -c \
              "grep -roh 'http[s]*://[^\"'\'']*' .next/ 2>/dev/null | sort -u | head -20" || true
            exit 1
          fi

          # Secondary check: warn if localhost:8000 is found in main JS files (not source maps)
          # This is a warning, not a failure, since dead code paths may contain the fallback
          if docker run --rm "$IMAGE" sh -c \
            "grep -r 'localhost:8000' .next/server/ .next/static/ 2>/dev/null --include='*.js' | grep -v '.map'" \
            | head -1; then
            echo "::warning::localhost:8000 found in compiled JS. This may be dead code or fallback string."
          else
            echo "✅ No localhost:8000 found in compiled JavaScript"
          fi

  # ---------------------------------------------------------------------------
  # Deploy to Azure Container Apps
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Deploy via Terraform
  # ---------------------------------------------------------------------------
  deploy:
    needs: [build-backend, build-frontend]
    # Deploy if: at least one build succeeded AND neither failed (skipped is OK)
    if: >-
      always() && github.event_name != 'pull_request' && (needs.build-backend.result == 'success' ||
      needs.build-frontend.result == 'success') && needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_db_admin_password: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_OPENROUTER_API_KEY }}
      TF_VAR_claude_api_key: ${{ secrets.TF_VAR_CLAUDE_API_KEY }}
      TF_VAR_cloudflare_origin_cert_password: ${{ secrets.TF_VAR_CLOUDFLARE_ORIGIN_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Cloudflare Origin Certificate
        env:
          CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
        if: env.CERT_B64 != ''
        run: |
          echo "$CERT_B64" | base64 -d > deployment/cloudflare-origin.pfx
          echo "TF_VAR_cloudflare_origin_cert_frontend=deployment/cloudflare-origin.pfx" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: deployment
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.TF_STORAGE_ACCOUNT }}" \
            -backend-config="resource_group_name=bible-app-tfstate-rg" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bible-app.tfstate"

      - name: Terraform Apply
        working-directory: deployment
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform apply \
            -var-file="terraform.tfvars" \
            -var="backend_image=${{ env.ACR_NAME }}.azurecr.io/bible-backend:${{ github.sha }}" \
            -var="frontend_image=${{ env.ACR_NAME }}.azurecr.io/bible-frontend:${{ github.sha }}" \
            -auto-approve

      - name: Login to Azure (for verification)
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Verify Deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          # Check backend health
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$BACKEND_URL" ]; then
            echo "Backend URL: https://$BACKEND_URL"
            curl -sf "https://$BACKEND_URL/health" || echo "Backend health check pending..."
          fi

          # Get frontend URL
          FRONTEND_URL=$(az containerapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -n "$FRONTEND_URL" ]; then
            echo "Frontend URL: https://$FRONTEND_URL"
          fi

      - name: Post Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed via Terraform**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Image Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Seed Database (runs when scripts change or manually triggered)
  # ---------------------------------------------------------------------------
  seed-database:
    needs: [changes, deploy]
    if: >-
      github.event_name != 'pull_request' && (needs.changes.outputs.scripts == 'true' || github.event_name ==
      'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "api/requirements.txt"

      - name: Install dependencies
        run: |
          pip install httpx asyncpg sqlalchemy openai

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Get Database Connection String
        id: db
        run: |
          # Get PostgreSQL FQDN from Azure
          DB_HOST=$(az postgres flexible-server list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].fullyQualifiedDomainName" -o tsv)
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT

      - name: Load Bible Data
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
        run: |
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          cd scripts
          echo "Loading Bible translations..."
          python load_bible.py --all

      - name: Generate Embeddings
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
        run: |
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          cd scripts
          echo "Generating embeddings with Azure OpenAI..."
          python create_azure_embeddings.py

      - name: Verify Database
        env:
          DB_USER: ${{ secrets.TF_VAR_DB_ADMIN_USERNAME }}
          DB_PASS: ${{ secrets.TF_VAR_DB_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.db.outputs.db_host }}
          DB_NAME: ${{ secrets.TF_VAR_DB_NAME }}
        run: |
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          pip install psycopg2-binary
          python -c "
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM verses')
          verse_count = cur.fetchone()[0]
          cur.execute('SELECT COUNT(*) FROM verses WHERE embedding IS NOT NULL')
          embedded_count = cur.fetchone()[0]
          print(f'Total verses: {verse_count}')
          print(f'Verses with embeddings: {embedded_count}')
          if verse_count == 0:
              raise Exception('No verses loaded!')
          if embedded_count == 0:
              raise Exception('No embeddings generated!')
          "

      - name: Post Seeding Summary
        run: |
          echo "## Database Seeding Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bible data loaded and embeddings generated successfully." >> $GITHUB_STEP_SUMMARY
