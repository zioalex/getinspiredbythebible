name: Frontend E2E

# BITB-250: cross-browser read-aloud e2e. Runs frontend/e2e/read-aloud.spec.ts on Chromium,
# Firefox, WebKit and Mobile Safari against a production build served by Playwright's webServer
# (see frontend/playwright.config.ts). The chat backend and speechSynthesis are mocked in the
# spec, so no secrets or services are needed. Not a required check yet; make it required once
# it has been stable for a while.

# yamllint flags the unquoted `on` key as a YAML 1.1 truthy value.
"on":
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-aloud-e2e:
    name: Read-aloud e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, "Mobile Safari"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        # Pinned: the spec mocks this API URL (API_ORIGIN in read-aloud.spec.ts). Same origin as
        # the app, so the mocked backend needs no CORS preflight.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/e2e-api
        run: npm run build

      - name: Resolve Playwright browser
        id: browser
        # Chromium is the base install for every project; WebKit also serves Mobile Safari.
        run: |
          if [ "$PROJECT" = "Mobile Safari" ]; then
            echo "name=webkit" >> "$GITHUB_OUTPUT"
          else
            echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
          fi
        env:
          PROJECT: ${{ matrix.project }}

      # BITB-341 budget. The apt half is NOT retry-wrapped: `timeout` TERMs `npx`, orphaning
      # the `sudo apt-get` it spawned, which keeps /var/lib/dpkg/lock-frontend -- a second
      # attempt would then die instantly on "Could not get lock". apt already retries its own
      # downloads (Acquire::Retries), so it just gets a generous single attempt instead. Only
      # the browser download (plain CDN fetch, no system locks) is retried.
      #   deps 14m + browser 3 x 2m = 6m + spec 6m = 26m, inside the job's 30m, leaving ~4m for
      #   checkout / npm ci / build. A healthy leg finishes the whole job in ~4m; the 2026-11-17
      #   slow-mirror event needed ~13m for apt alone and was cancelled at 15m.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.browser.outputs.name }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ steps.browser.outputs.name }}-

      - name: Install Playwright system deps
        # The apt half: never cacheable, and what stalls when the Ubuntu mirror crawls. One
        # attempt by design (see the budget comment above) -- the step timeout is the bound.
        timeout-minutes: 14
        run: npx playwright install-deps ${{ steps.browser.outputs.name }}

      - name: Install Playwright browser
        # The binary half: a CDN download, safe to retry. Not gated on the cache hit --
        # `playwright install` is a no-op when the binary is present, and gating would break a
        # partially restored cache.
        timeout-minutes: 8
        run: |
          for attempt in $(seq 1 3); do
            echo "playwright install: attempt $attempt of 3"
            rc=0
            timeout 2m npx playwright install ${{ steps.browser.outputs.name }} || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$rc" -eq 124 ]; then
              echo "::warning::playwright install attempt $attempt timed out after 2m (stalled CDN?)"
            else
              echo "::warning::playwright install attempt $attempt failed with exit code $rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Run read-aloud spec
        timeout-minutes: 6
        # CI=true (set by Actions) makes playwright.config.ts start `npm run start` on :3000.
        run: npx playwright test e2e/read-aloud.spec.ts --project="${{ matrix.project }}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
