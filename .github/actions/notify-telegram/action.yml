name: Notify Telegram on probe transition
description: >
  Sends a Telegram alert when a monitor probe job transitions pass→fail or fail→pass. Suppresses repeated alerts during
  sustained outages by stamping the previous state into the GitHub Actions cache.

inputs:
  job_status:
    description: "github.job's status — 'success' or 'failure' (or 'cancelled')."
    required: true
  job_name:
    description: "Logical probe name used as the cache key suffix and in messages."
    required: true
  state_branch:
    description: "Reserved (state lives in the Actions cache, not a branch)."
    required: false
    default: gh-monitor-state
  telegram_bot_token:
    description: "Telegram bot token. Not logged."
    required: true
  telegram_chat_id:
    description: "Telegram chat ID — negative for groups."
    required: true
  force_alert:
    description: "If 'true', always send a test alert regardless of transition."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore previous state
      id: restore
      uses: actions/cache/restore@v4
      with:
        # Cache key uses run_id so each run gets a fresh entry; restore-keys
        # falls back to the latest prior cache for this job.
        key: monitor-state-${{ inputs.job_name }}-${{ github.run_id }}
        restore-keys: |
          monitor-state-${{ inputs.job_name }}-
        path: monitor-state.txt

    - name: Compute transition and send alert
      id: notify
      shell: bash
      env:
        JOB_STATUS: ${{ inputs.job_status }}
        JOB_NAME: ${{ inputs.job_name }}
        TG_TOKEN: ${{ inputs.telegram_bot_token }}
        TG_CHAT: ${{ inputs.telegram_chat_id }}
        FORCE_ALERT: ${{ inputs.force_alert }}
      run: |
        set -euo pipefail

        # Map job status → simple pass/fail token. Treat 'cancelled' as
        # neither (don't update state, don't alert).
        case "$JOB_STATUS" in
          success) curr=pass ;;
          failure) curr=fail ;;
          *)
            echo "skipping notify: job_status=$JOB_STATUS"
            exit 0
            ;;
        esac

        # --- Restore and parse previous state ---
        prev_raw=""
        if [ -f monitor-state.txt ]; then
            prev_raw=$(head -c 32 monitor-state.txt | tr -d '[:space:]' || true)
        fi

        # Parse state token and optional timestamp
        prev_token="${prev_raw%%:*}"   # "pass", "fail", or ""
        prev_ts=""
        if [[ "$prev_raw" == *:* ]]; then
            prev_ts="${prev_raw#*:}"   # unix timestamp of first failure
        fi

        # --- Decide message ---
        msg=""
        now=$(date +%s)

        if [ "$FORCE_ALERT" = "true" ]; then
            msg="🧪 *prod-monitor* test alert from \`${JOB_NAME}\` (status=${curr})"
        elif [ "$prev_token" = "" ] && [ "$curr" = "fail" ]; then
            msg="🚨 *prod-monitor / ${JOB_NAME}* DOWN (no prior state)"
        elif [ "$prev_token" = "pass" ] && [ "$curr" = "fail" ]; then
            msg="🚨 *prod-monitor / ${JOB_NAME}* DOWN"
        elif [ "$prev_token" = "fail" ] && [ "$curr" = "pass" ]; then
            # Compute how long it was down
            if [ -n "$prev_ts" ]; then
                down_for=$(( now - prev_ts ))
                down_min=$(( down_for / 60 ))
                msg="✅ *prod-monitor / ${JOB_NAME}* RECOVERED (was down ~${down_min}m)"
            else
                msg="✅ *prod-monitor / ${JOB_NAME}* RECOVERED"
            fi
        elif [ "$prev_token" = "fail" ] && [ "$curr" = "fail" ]; then
            # Still failing — re-alert every 30 minutes
            if [ -n "$prev_ts" ]; then
                elapsed=$(( now - prev_ts ))
                if [ "$elapsed" -ge 1800 ]; then
                    down_min=$(( elapsed / 60 ))
                    msg="🔴 *prod-monitor / ${JOB_NAME}* still DOWN (${down_min}m)"
                fi
            fi
        else
            echo "no transition (prev=${prev_token:-none} → curr=${curr}); not alerting"
        fi

        if [ -n "$msg" ]; then
          # Append run link
          msg="${msg}
        Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Append failure detail if the job wrote one
          detail_file="${RUNNER_TEMP}/detail.txt"
          if [ -f "$detail_file" ] && [ -s "$detail_file" ]; then
            detail=$(head -c 1500 "$detail_file")
            msg="${msg}

        Detail:
        \`\`\`
        ${detail}
        \`\`\`"
          fi

          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not set; would send: $msg"
          else
            # Use --data-urlencode for text so newlines/markdown survive
            http=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              -d "parse_mode=Markdown" \
              --data-urlencode "text=${msg}" || echo "000")
            if [ "$http" != "200" ]; then
              echo "::warning::Telegram sendMessage returned HTTP ${http}"
            else
              echo "telegram alert sent (${#msg} chars)"
            fi
          fi
        fi

        # --- Save new state ---
        if [ "$curr" = "fail" ]; then
            if [ "$prev_token" = "fail" ] && [ -n "$prev_ts" ]; then
                # Keep original failure timestamp — but reset if we just re-alerted
                if [ -n "$msg" ]; then
                    # re-alert was sent; reset the 30min window from now
                    printf 'fail:%d' "$now" > monitor-state.txt
                else
                    # still failing, no re-alert yet — preserve original timestamp
                    printf '%s' "$prev_raw" > monitor-state.txt
                fi
            else
                # First failure — record timestamp
                printf 'fail:%d' "$now" > monitor-state.txt
            fi
        else
            printf '%s' "$curr" > monitor-state.txt
        fi

    - name: Save new state
      uses: actions/cache/save@v4
      with:
        key: monitor-state-${{ inputs.job_name }}-${{ github.run_id }}
        path: monitor-state.txt
