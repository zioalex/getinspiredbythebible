# Agent: default-wf2 — the canonical, full, self-contained manifest
# (BITB-171/172/285).
#
# configRef -> the opencode-config ConfigMap, PVC-backed persistence per
# BITB-128, all provider credentials, the pinned custom agentImage. This is
# THE repo source for the live object (the former deployment/kubeopencode/
# twin was removed in BITB-285 after a verified zero-drift twin-check; owner
# `kubectl diff` confirmed live == this manifest, 2026-11-09).
#
# agentImage + imagePullSecrets (BITB-172): the custom build of the opencode
# binary in a private GHCR package. These fields lived only on the live cluster
# object (applied by kubectl patch per custom-opencode-image.md) until BITB-172
# committed them; repo applies silently fell back to the default :latest image.
#
# server-password (OPENCODE_SERVER_PASSWORD) is deliberately NOT pre-wired
# (BITB-172): pre-wiring it made every pod crashloop with
# CreateContainerConfigError on clusters without the opencode-server-auth
# secret — exactly the default-wf3 failure that surfaced the drift. Mobile
# Basic auth is opt-in per agent; see mobile-access.md.
#
# Prerequisites (see README.md):
#   - ConfigMap opencode-config (make sync-opencode-configmap) — the Agent
#     will not start without it
#   - Secrets: ai-credentials, openrouter-api-key, github-copilot-auth
#   - Secret ghcr-pull (the agentImage package is private)
#   - RBAC: role-agent.yaml + rolebinding-agent.yaml (serviceAccountName below)
apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: default-wf2
  namespace: kubeopencode-system
spec:
  profile: "General-purpose development agent with automatic fallback"
  workspaceDir: /workspace
  serviceAccountName: kubeopencode-agent
  # Custom opencode binary (pinned tag — never :latest; see
  # custom-opencode-image.md). Kept in whole-spec parity with
  # agent-default-wf3.yaml by scripts/test_kubeopencode_manifests.py (T7/T8).
  agentImage: ghcr.io/zioalex/kubeopencode-agent-opencode:v0.1.9-oc1.18.31
  imagePullSecrets:
    - name: ghcr-pull
  # Full OpenCode config (models, prompts, permissions, fallbacks) comes from
  # the generated opencode.json via the ConfigMap — NOT inline. Run
  # `make sync-opencode-configmap` (repo root) before applying. configRef and
  # inline spec.config are mutually exclusive (runtime-validated).
  configRef:
    configMapRef:
      name: opencode-config
      key: opencode.json
  # BITB-128: without this the workspace is an EmptyDir, so every pod
  # replacement — including the `kubectl delete pod` the README requires after
  # each `make sync-opencode-configmap` — destroys the clone, any uncommitted
  # work, and the session history. The operator creates and owns these PVCs.
  # storageClassName is intentionally omitted so the cluster default applies.
  # Note: this covers spec.workspaceDir (/workspace) only — /tmp is NOT
  # persisted, so place git worktrees under ${WORKSPACE_DIR}/worktrees
  # (see AGENTS.md, Git Worktree Pattern).
  persistence:
    workspace:
      size: 20Gi
    sessions:
      size: 2Gi
  credentials:
    # provider key (OpenCode Zen)
    - name: api-key
      secretRef:
        name: ai-credentials
        key: api-key
      env: OPENCODE_API_KEY
    # GitHub Copilot OAuth user token (gho_...) for the github-copilot provider.
    # PATs (classic ghp_... or fine-grained github_pat_...) are rejected by the
    # copilot_internal/v2/token exchange — see k8s/kubeopencode/README.md
    # "Persist GitHub Copilot access".
    - name: github-copilot
      secretRef:
        name: github-copilot-auth
        key: token
      env: GITHUB_TOKEN
    # OpenRouter key: paid primary for android-gemini + tier-2 runtime fallback
    # for every agent (cross-provider resilience).
    - name: openrouter-api-key
      secretRef:
        name: openrouter-api-key
        key: openrouter-api-key
      env: OPENROUTER_API_KEY
