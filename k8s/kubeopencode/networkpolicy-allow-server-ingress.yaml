apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-ingress
  namespace: kubeopencode-system
  labels:
    app.kubernetes.io/part-of: kubeopencode
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kubeopencode
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubeopencode-server
      ports:
        - port: 4096
          protocol: TCP
    - from:
        # `kubernetes.io/metadata.name` is set by the API server on every
        # namespace; a bare `name` label is not, and selecting on it would
        # silently match zero peers.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 4096
          protocol: TCP
