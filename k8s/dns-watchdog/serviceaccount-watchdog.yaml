# BITB-155. ServiceAccount for the DNS watchdog. Permissions live in
# role-watchdog.yaml; see that file for the trust-boundary rationale.
# One Kubernetes object per file: the repo's check-yaml pre-commit hook runs
# without --allow-multiple-documents, so a multi-document manifest fails CI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-watchdog
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dns-watchdog
