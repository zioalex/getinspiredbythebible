services:
  # Main API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-mistral:7b}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mxbai-embed-large}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - OLLAMA_HOST=http://ollama:11434
      # Defaults to the in-stack Postgres so `make docker-up` works out of the box.
      - DATABASE_URL=${DATABASE_URL:-postgresql://bible:bible123@postgres:5432/bibledb}
      # BITB-061's Postgres-backed rate limiter exists to keep counters correct
      # across multiple prod replicas -- meaningless for this single-instance local
      # stack. Default to the in-memory backend here: (1) local/CI Postgres has no
      # pg_cron (migration 010), so rate_limit_hits/rate_limit_sessions would grow
      # unbounded over a long dev session; (2) before this default existed, a fresh
      # local/CI volume had neither table, so every /chat request errored, tripping
      # the circuit breaker to fail closed (real 429s) after 5 requests. Prod is
      # unaffected -- it doesn't set this var, so it keeps Settings' own default of
      # "postgres" (api/config.py).
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-memory}
      # OpenRouter settings
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-meta-llama/llama-3.3-70b-instruct}
      - OPENROUTER_ALLOW_FALLBACKS=${OPENROUTER_ALLOW_FALLBACKS:-true}
      # Other provider settings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Ollama - Self-hosted LLM and Embeddings
  ollama:
    image: ollama/ollama:latest
    ports:
      - "0.0.0.0:11434:11434"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-mistral:7b}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mxbai-embed-large}
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/bash", "/init-ollama.sh"]
    # For CPU-only, comment out or remove the deploy section below
    # Uncomment for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot job: loads Bible data and generates embeddings on first start
  # (skips itself when the verses table is already populated).
  db-init:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://bible:bible123@postgres:5432/bibledb}
      - OLLAMA_HOST=http://ollama:11434
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mxbai-embed-large}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      # db-init runs as a non-root container user (UID 1000) while ./data is host-owned; mounting
      # it read-only (below) means a missing translation download must land somewhere writable.
      - BIBLE_DOWNLOAD_CACHE_DIR=/tmp/bible-translations
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./scripts:/scripts
      # Read-only: committed translations (data/bible/translations/*.json) are the source of
      # truth, including manual-only Hindi/Luther data with no download URL. db-init runs as a
      # non-root UID that doesn't own the host-owned bind mount, so this must stay read-only;
      # first-run downloads (e.g. KJV) are written to BIBLE_DOWNLOAD_CACHE_DIR instead (see
      # scripts/load_bible.py's resolve_bible_data_path()).
      - ./data:/data:ro
      # Read-only: run_migrations.py resolves ../../api relative to its own
      # path (matching the layout azure-deploy.yml's run-migrations job sees
      # from a full checkout), so it needs api/ visible at /api here.
      - ./api:/api:ro
    working_dir: /scripts
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    restart: "no"

  # PostgreSQL with pgvector for semantic search
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=bible
      - POSTGRES_PASSWORD=bible123
      - POSTGRES_DB=bibledb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d bibledb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps # Use deps stage for development
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      # In production with reverse proxy, API is on same domain
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev # Override for development mode

volumes:
  # Fixed (non-project-prefixed) name so the dev stack (docker-compose.dev.yml,
  # which references it as an external volume) shares the same Ollama model
  # cache instead of re-downloading ~5GB of models.
  # Existing installs: models previously lived in getinspiredbythebible_ollama_data;
  # either let Ollama re-pull on next start, or copy them over once:
  #   docker volume create ollama_data
  #   docker run --rm -v getinspiredbythebible_ollama_data:/from -v ollama_data:/to \
  #     alpine sh -c "cp -a /from/. /to/"
  ollama_data:
    name: ollama_data
  postgres_data:
