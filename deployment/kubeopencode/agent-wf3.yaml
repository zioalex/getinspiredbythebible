apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: default-wf3
  namespace: kubeopencode-system
spec:
  profile: "General-purpose development agent with automatic fallback"
  workspaceDir: /workspace
  serviceAccountName: kubeopencode-agent
  # Same pinned custom opencode binary as default-wf2 (BITB-172): the live
  # Agent runs this tag; committing it here keeps repo applies converging
  # with live instead of silently falling back to the default :latest
  # image. The GHCR package is private, hence ghcr-pull
  # (custom-opencode-image.md Option B).
  #
  # Provenance (BITB-283): transcribed from the VERIFIED live spec
  # (kubectl -n kubeopencode-system get agent default-wf3 -o yaml,
  # 2026-11-09) so the second workflow agent is visible from the
  # canonical deployment folder -- the 2026-11-09 outage recovery
  # analysis had to query the cluster for what only
  # k8s/kubeopencode/agent-default-wf3.yaml knew. The two manifests
  # are field-for-field identical (both faithful to the same live
  # object) and scripts/test_kubeopencode_manifests.py (T7/BITB-283)
  # fails if they drift -- the BITB-171 lesson: two manifests for one
  # object diverge silently without a test keeping them in sync.
  agentImage: ghcr.io/zioalex/kubeopencode-agent-opencode:v0.1.9-oc1.18.31
  imagePullSecrets:
    - name: ghcr-pull
  # Full OpenCode config (models, prompts, permissions, fallbacks) is generated
  # from .opencode/agents/*.md via `make gen-opencode-config` and synced with
  # `make sync-opencode-configmap` (BITB-123, Option A2). The controller reads
  # this ConfigMap at reconcile time (it is not watched -- a change lands only
  # on the next reconcile; see README "What the controller owns").
  configRef:
    configMapRef:
      name: opencode-config
      key: opencode.json
  # BITB-128: without this the workspace is an EmptyDir, so every pod
  # replacement -- including the `kubectl delete pod` the README requires after
  # each `make sync-opencode-configmap` -- destroys the clone, any uncommitted
  # work, and the session history. The operator creates and owns these PVCs.
  # storageClassName is intentionally omitted so the cluster default applies.
  # Note: this covers spec.workspaceDir (/workspace) only -- /tmp is NOT
  # persisted, so place git worktrees under ${WORKSPACE_DIR}/worktrees
  # (see AGENTS.md, Git Worktree Pattern).
  persistence:
    workspace:
      size: 20Gi
    sessions:
      size: 2Gi
  credentials:
    - name: api-key
      secretRef:
        name: ai-credentials
        key: api-key
      env: OPENCODE_API_KEY
    # GitHub Copilot OAuth user token (gho_...) for the github-copilot provider.
    # PATs (classic ghp_... or fine-grained github_pat_...) are rejected by the
    # copilot_internal/v2/token exchange -- see README "Persist GitHub Copilot
    # access". The Agent CRD exposes no volume/volumeMount fields, so auth.json
    # mounting is not wirable here; GITHUB_TOKEN remains the supported mechanism.
    - name: github-copilot
      secretRef:
        name: github-copilot-auth
        key: token
      env: GITHUB_TOKEN
    - name: openrouter-api-key
      secretRef:
        name: openrouter-api-key
        key: openrouter-api-key
      env: OPENROUTER_API_KEY
