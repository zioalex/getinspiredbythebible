apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: default-wf
  namespace: kubeopencode-system
spec:
  plugins:
    - name: opencode-runtime-fallback@0.2.4
      options:
        retryOn: [429, 500, 502, 503, 504]
        maxFallbackAttempts: 1
        cooldownSeconds: 120
        timeoutSeconds: 45
        notifyOnFallback: true
  config:
    $schema: https://opencode.ai/config.json
    model: opencode/nemotron-3-ultra-free
    small_model: opencode/nemotron-3-ultra-free
    provider:
      opencode:
        options:
          timeout: 600000
          headerTimeout: 60000
          chunkTimeout: 120000
          setCacheKey: true
    agent:
      orchestrator:
        model: github-copilot/claude-opus-5
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      android-expert:
        model: opencode/nemotron-3-ultra-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      fullstack-engineer:
        model: opencode/nemotron-3-ultra-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      infra-engineer:
        model: opencode/nemotron-3-ultra-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      android-gemini:
        model: openrouter/qwen/qwen3-coder
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      data-engineer:
        model: opencode/nemotron-3-ultra-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      verse-parity-keeper:
        model: opencode/mimo-v2.5-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      i18n-qa:
        model: opencode/mimo-v2.5-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      verifier:
        model: github-copilot/claude-opus-5
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      risk-auditor:
        model: github-copilot/claude-opus-5
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      failure-forecaster:
        model: opencode/nemotron-3-ultra-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
      seo-auditor:
        model: opencode/nemotron-3-ultra-free
        fallbackModels:
          - opencode/muse-spark-1.3-contributor-free
  credentials:
    - name: api-key
      secretRef:
        name: ai-credentials
        key: api-key
      env: OPENCODE_API_KEY
    - name: openrouter-api-key
      secretRef:
        name: ai-credentials
        key: openrouter-api-key
      env: OPENROUTER_API_KEY
