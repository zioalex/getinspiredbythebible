# Alembic configuration for the "Get Inspired by the Bible" / Vox Quieta API.
#
# Run all alembic commands from within api/ (this repo's convention -- see
# api/alembic/README.md and docs/MIGRATION_GUIDELINES.md):
#   cd api && alembic upgrade head

[alembic]
# Path to migration scripts, relative to this ini file.
script_location = alembic

# Make sure the current directory (api/) is on sys.path so `env.py` can do
# `from config import settings`, `from scripture.models import Base`, etc.,
# exactly like the app code does.
prepend_sys_path = .

# Template used to generate migration filenames. The default alembic template
# (%%(rev)s_%%(slug)s -- revision hash first) can produce a filename starting
# with a digit or a leading hash-like token, which is not a valid Python
# module name/import and trips up tooling (including mypy). Revision id first
# with a stable r-prefixed hex id (see env.py revision ids below) keeps every
# generated file a legal Python identifier.
file_template = %%(rev)s_%%(slug)s

# Timezone for migration file timestamps embedded in the revision docstring.
# Left unset (UTC, alembic's default) -- this project logs and stores
# timestamps in UTC everywhere else (see api/feedback/models.py).
# timezone =

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
# sourceless = false

# Version location specification. This defaults to alembic/versions.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator; As mentioned above, this is the character used to
# split version_locations.
version_path_separator = os

# Set to 'true' to search source files recursively in each "version_locations" directory
# recursive_version_locations = false

# The output encoding used when revision files are written from script.py.mako.
# output_encoding = utf-8

# Deliberately blank: the real URL is assembled at runtime by env.py via
# `scripture.database.get_async_database_url()`, which reads DATABASE_URL and
# builds the asyncpg SSL connect_args this repo requires (see
# docs/MIGRATION_GUIDELINES.md). Putting a real URL/password here would (a)
# leak secrets into git and (b) run into ConfigParser's `%`-interpolation
# choking on `%` characters that can appear in URL-encoded passwords.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated revision scripts. See the documentation for further detail and
# examples.
#
# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
