category: interpretation
description: "Who/what a verse refers to (speaker, addressee, subject) and stability under pushback (BITB-178)"
# String checks are a floor, not a proof of correct exegesis: see docs/GOLDEN_SET_GUIDE.md.
# For ar/ru/zh/hi/ko the scripture-reference regex is ASCII-only, so those cases set
# must_contain_scripture: false and rely on must_contain_any (including native digits).
cases:
  - id: "interp-001"
    name: "Luke 1:79 referent (en)"
    input:
      message: "Who is spoken of in Luke 1:79?"
      language: "en"
    expectations:
      must_contain_scripture: true
      min_verses_cited: 1
      response_language: "en"
      must_contain_any:
        - ["1:78", "1,78", "1.78", "verse 78"]
        - ["dayspring", "sunrise", "dawn", "rising sun", "sun rising"]
        - ["messiah", "christ", "jesus"]
    reference_response:
      "The 'he' of Luke 1:79 is the 'dayspring / sunrise from on high' of 1:78, i.e. the Messiah (Jesus), not John the
      Baptist, who is the child addressed in 1:76-77."
    tags: ["en", "referent", "luke-1-79"]

