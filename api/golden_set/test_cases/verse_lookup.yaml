category: verse_lookup
description: "Direct verse lookup and explanation requests"
cases:
  - id: "verse-001"
    name: "John 3:16"
    input:
      message: "What does John 3:16 say?"
    expectations:
      must_contain_scripture: true
      min_verses_cited: 1
      expected_books: ["John"]
      source_statement_required: true
      source_is_biblical: true
      response_language: "en"
    tags: ["well-known", "gospel"]

