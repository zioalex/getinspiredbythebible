[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
asyncio_mode = auto
markers =
    network: marks tests as requiring network access (deselect with '-m "not network"')
    golden_set: marks golden set evaluation tests (deselect with '-m "not golden_set"')
    functional: marks functional tests that hit a live API (skipped if API unreachable)
    e2e: marks end-to-end tests simulating real user browser behavior via the frontend URL
