# Secrets inventory (BITB-305). NAMES AND DATES ONLY.
#
# NEVER put a secret value, a token prefix, a hash or a fingerprint in this file.
#
# One entry per credential the project depends on: every `secrets.NAME` referenced by
# .github/workflows/*.yml, plus every sensitive Terraform variable that has no workflow secret
# feeding it (kind: terraform-variable). GITHUB_TOKEN is deliberately NOT listed: GitHub mints
# it per workflow run and it never expires on a calendar.
#
# Fields
#   name          secret / variable name (unique)
#   kind          github-actions-secret | terraform-variable
#   used_by       list of workflow files (basename), `terraform:<variable>` or free-text strings
#   expires       YYYY-MM-DD | never | unknown
#   rotation_doc  repo-relative path#anchor describing how to rotate it
#   owner         who rotates it (`unknown` until the owner fills it in)
#
# Checked by scripts/check_secrets_inventory.py:
#   --completeness   PR gate: every secrets.NAME in the workflows has an entry
#   (default)        weekly: fails on expired, within 21 days, or unknown (unless --allow-unknown)
# Workflow: .github/workflows/secrets-expiry-check.yml
# Other dated deadlines (EOL, model retirement): docs/DATES_TO_WATCH.md
#
# OWNER TODO: replace each `expires: unknown` / `owner: unknown`, then remove
# --allow-unknown from the workflow.

secrets:
  - name: ARM_CLIENT_ID
    kind: github-actions-secret
    description: "Azure service principal (Terraform/azure CLI login)"
    used_by:
      - azure-deploy.yml
      - db-firewall-cleanup.yml
      - prod-deploy-drift.yml
      - prod-monitor.yml
