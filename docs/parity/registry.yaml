          - frontend/src/app/[locale]/about/page.tsx
      android:
        status: synced
        evidence:
          - android/app/src/main/kotlin/org/voxquieta/app/utils/LegalUrls.kt:27-32
      ios:
        status: obligated
        story: BITB-087
        note: Tier 1 "Settings with Privacy / Terms / About links" — mirror LegalUrls.kt.

