# Cross-client parity registry — BITB-262 (BITB-260 stage 2)
#
# The store of record for "which client has which capability, and how do the
# implementations relate?". Every row is RE-VERIFIED against the code before it
# enters (a plausible-but-wrong row is worse than a missing one — BITB-260's
# explicit non-goal) and every evidence entry that looks like a repo path is
# existence-checked by tools/parity-graph/analyze.py on every run.
#
# Schema: tools/parity-graph/registry.schema.json (jsonschema, validated in CI)
# Validate + regenerate the derived artifacts:
#   python tools/parity-graph/analyze.py          # → docs/parity/graph.json
#   python tools/parity-graph/render.py           # → docs/parity/landscape.md
#   make parity-registry-check                    # freshness gate (also in CI)
#
# Status vocabulary (per capability × client):
#   synced    — implemented and at parity with the row's reference behavior (evidence required)
#   drifted   — implementations diverged; the gap is tracked by a story (evidence required)
#   partial   — exists but incomplete; open follow-ups remain (evidence required)
#   absent    — not implemented on this client while peers have it (or not landed anywhere yet)
#   obligated — a planned client's spec requires it (story required)
#   n/a       — does not apply to this client (decision or by construction; note says why)

schema_version: 1
updated: "2026-11-08"

clients:
  api:
    kind: backend
    repo_path: api/
    description: FastAPI backend — the contract source every client programs against, not a UI.
  web:
    kind: client
    repo_path: frontend/
    description: Next.js web client (voxquieta.org), 11 UI locales.
  android:
    kind: client
    repo_path: android/
    description: Kotlin / Jetpack Compose client, 11 UI locales, Play-distributed.
  ios:
    kind: client
    repo_path: ios/
    status: planned
    story: BITB-087
    description: Planned SwiftUI client (BITB-087, unscheduled); no ios/ directory exists yet.

contracts:
  - id: chat-stream-sse
    description: >-
      SSE streaming chat protocol: metadata event before content, content chunks, completion event (message_id, model,
      detected_translation, scripture_context, verses_cited, resolved_verses, corrected_message, corrections,
      follow_ups, language_suggestion, crisis_resources).
    source_of_truth:
      - api/chat/service.py
      - docs/parity/openapi.json
      - BITB-086
    consumers:
      api:
        status: synced
        evidence:
          - api/chat/service.py:2141
          - api/chat/service.py
        note: Emits the stream; the contract's source (not a consumer in the UI sense).
      web:
        status: synced
        evidence:
          - frontend/src/lib/api.ts:699
          - frontend/src/lib/api.ts:783
      android:
        status: synced
        evidence:
          - android/app/src/main/kotlin/org/voxquieta/app/data/streaming/EventSourceParser.kt:29-97
          - android/app/src/main/kotlin/org/voxquieta/app/data/remote/models/ChatResponseDto.kt
      ios:
        status: obligated
        story: BITB-087
        note: Tier 1 "Streaming chat over SSE"; match EventSourceParser.kt's lenient parsing exactly.

  - id: citations-spans
    description: >-
      Server-emitted citation spans (BITB-086): the completion event carries `citations` — where each verses_cited
      reference sits in the final answer text — so a client needs no verse regex of its own. Proven in the web client by
      BITB-109 (PR #1055).
    source_of_truth:
      - api/utils/verse_parser.py
      - api/chat/service.py:2135-2141
      - docs/DONE/BITB-086-server-emitted-citation-spans.md
    consumers:
      api:
        status: synced
        evidence:
          - api/chat/service.py:2141
      web:
        status: synced
        evidence:
          - frontend/src/lib/citationSpans.ts
          - frontend/src/lib/citationSpans.test.ts
        story: BITB-109
        pr: 1055
      android:
        status: partial
        evidence:
          - android/app/src/main/kotlin/org/voxquieta/app/data/streaming/EventSourceParser.kt:87-97
          - android/app/src/main/kotlin/org/voxquieta/app/presentation/components/ChatMessageItem.kt:360-404
        note: >-
          Consumes the server-extracted references (verses_cited / resolved_verses) but NOT the `citations` span
          offsets; inline linkification stays client-regex (injectVerseLinks). The span contract itself is unconsumed on
          Android today.
      ios:
        status: obligated
        story: BITB-087
        note: iOS's ONLY citation mechanism — locate spans by text+occurrence substring search.

  - id: verse-grammar
    description: >-
      Shared verse-reference grammar (separators, range chars, fullwidth digits) generated from one fixture into web and
      Android, and reconciled by parity tests with the backend parser.
    source_of_truth:
      - tests/fixtures/verse_grammar.json
      - scripts/generate_localized_book_map.py
    consumers:
      api:
        status: drifted
        evidence:
          - api/utils/verse_parser.py:351
          - api/tests/test_verse_grammar_parity.py
        story: BITB-267
        note: >-
          Reconciled by parity tests, but the whitelist lookbehind still misses a citation after `**`, `—` or `¿` that
          web/Android catch (BITB-267, Todo) — a live backend drift.
      web:
        status: synced
        evidence:
          - frontend/src/lib/verseGrammar.generated.ts
          - frontend/src/lib/verseCorpus.crossplatform.test.ts
      android:
        status: synced
        evidence:
          - android/app/src/main/kotlin/org/voxquieta/app/utils/VerseGrammar.kt
          - android/app/src/test/kotlin/org/voxquieta/app/utils/VerseGrammarTest.kt
      ios:
        status: n/a
        note: >-
          iOS ships no verse grammar (see ios-no-verse-regex); it consumes citations-spans instead. The shared corpus
          remains the cross-client fixture set for its rendering tests.

  - id: strings-catalog
    description: >-
      UI string catalog completeness across all 11 locales. Android completeness is enforced by the
      `translation-validation` CI job (.github/workflows/android-ci.yml); tools/parity-graph re-runs the identical check
      against the identical files (mechanically pinned — it reads the workflow's own extraction regex on every run), so
      the two can never silently disagree.
    source_of_truth:
      - android/app/src/main/res/values/strings.xml
      - .github/workflows/android-ci.yml
      - frontend/src/test/translations.test.ts
    locales: [ar, de, en, es, fr, hi, it, ko, pt, ru, zh]
    consumers:
      web:
        status: synced
        evidence:
          - frontend/messages/en.json
          - frontend/src/test/translations.test.ts
        note: 11 locale files under frontend/messages/ (en, it, de, es, fr, pt, ar, ru, zh, hi, ko).
      android:
        status: synced
        evidence:
          - android/app/src/main/res/values/strings.xml
          - android/app/src/main/res/values-ru/strings.xml
        note: Default (English) + 10 locale dirs; key completeness gated by translation-validation.
      ios:
        status: obligated
        story: BITB-087
        note: >-
          255 strings × 11 locales via a conversion script from strings.xml/messages/*.json; mirror
          translation-validation so a missing key fails CI (BITB-087 Localization).

  - id: telemetry-os-enum
    description: >-
      Read-aloud telemetry funnel (BITB-247, PR #1226): clients POST {event, locale, platform, browser, os} with coarse
      fixed enums to /api/v1/client-events; never message text or IDs.
    source_of_truth:
      - api/main.py:567
      - docs/DONE/BITB-247-tts-start-failed-telemetry.md
    consumers:
      web:
        status: synced
        evidence:
          - frontend/src/lib/clientEvents.ts
          - frontend/src/components/ListenButton.tsx
      android:
        status: synced
        evidence:
          - android/app/src/main/kotlin/org/voxquieta/app/data/remote/models/ClientEventRequestDto.kt
          - android/app/src/main/kotlin/org/voxquieta/app/data/remote/api/BibleApiService.kt:86
      ios:
        status: n/a
        note: >-
          BITB-087 v1 ships NoOp analytics only (AnalyticsProtocol + NoOp default); the funnel contract applies if/when
          real analytics are switched on. Revisit that row then.

  - id: platform-flags
    description: >-
      Server-driven per-platform (web/android) feature flag registry on GET /config with explicit per-flag fail
      policies. Row reserved — status the cells when BITB-242 lands.
    status: absent
    story: BITB-242
    note: "Planned (BITB-242, Todo; pilot PR #1220). No flag registry exists on any client yet."
    source_of_truth:
      - docs/BACKLOG_STORIES/BITB-242-platform-selective-feature-flags.md
    consumers:
      api:
        status: absent
        note: Not landed (BITB-242).
      web:
        status: absent
        note: Not landed (BITB-242).
      android:
        status: absent
        note: Not landed (BITB-242).
      ios:
        status: n/a
        note: Postdates BITB-087's tier tables; scope when the port is scheduled.

  - id: permissions
    description: >-
      The clients request no OS permissions beyond the network: Android declares only INTERNET + ACCESS_NETWORK_STATE;
      iOS v1 must add no permission prompt (BITB-087 AC); web has no permission prompts (browser sandbox, mic-free).
    source_of_truth:
      - android/app/src/main/AndroidManifest.xml:5-6
      - docs/BACKLOG_STORIES/BITB-087-ios-app-v1-chat-parity.md
    consumers:
      web:
        status: n/a
        note: No permission surface; the read-aloud uses the browser's speech synthesis.
      android:
        status: synced
        evidence:
          - android/app/src/main/AndroidManifest.xml:5-6
        note: INTERNET + ACCESS_NETWORK_STATE only.
      ios:
        status: obligated
        story: BITB-087
        note: "No new permission prompts (BITB-087 AC); network only, same posture as Android."

  - id: legal-urls
    description: >-
      Per-locale privacy/terms URLs. The web owns the pages; Android links into them with the user's UI locale
